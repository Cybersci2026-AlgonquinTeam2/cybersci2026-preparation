<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 562" width="420" height="562" role="img" aria-label="Attack lifecycle (MITRE ATT&amp;CK tactics)"><title>Attack lifecycle (MITRE ATT&amp;CK tactics)</title><rect width="420" height="562" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Attack lifecycle (MITRE ATT&amp;CK tactics)</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">the attacker&#x27;s to-do list, in rough order</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Reconnaissance → Resource development</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Initial access (phish, exposed service, stolen</tspan><tspan x="210.0" dy="17.6">creds)</tspan></text><line x1="210.0" y1="226.15" x2="210.0" y2="244.15" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,240.15 L210.0,250.15 L216.0,240.15 z" fill="#64748B"/><rect x="16" y="254.15" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Execution → Persistence → Privilege escalation</tspan></text><line x1="210.0" y1="295.7" x2="210.0" y2="313.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,309.7 L210.0,319.7 L216.0,309.7 z" fill="#64748B"/><rect x="16" y="323.7" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="345.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Defense evasion → Credential access → Discovery</tspan></text><line x1="210.0" y1="365.25" x2="210.0" y2="383.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,379.25 L210.0,389.25 L216.0,379.25 z" fill="#64748B"/><rect x="16" y="393.25" width="388" height="35.5" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="415.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Lateral movement → Collection</tspan></text><line x1="210.0" y1="434.8" x2="210.0" y2="452.8" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,448.8 L210.0,458.8 L216.0,448.8 z" fill="#64748B"/><rect x="16" y="462.8" width="388" height="35.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="484.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Command &amp; control → Exfiltration → Impact</tspan></text><text x="16" y="518.85" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Defenders map detections to these tactics. CTF skills</tspan><tspan x="16" dy="16.9">live mostly in the middle rows.</tspan></text></svg>
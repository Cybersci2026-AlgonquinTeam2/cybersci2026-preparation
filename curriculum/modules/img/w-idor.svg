<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 304" width="420" height="304" role="img" aria-label="IDOR / broken access control"><title>IDOR / broken access control</title><rect width="420" height="304" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">IDOR / broken access control</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">the id is just a number</tspan></text><rect x="16" y="97.5" width="388" height="54.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">GET /invoice?id=1001</tspan><tspan x="210.0" dy="18.2">(your invoice)</tspan></text><line x1="210.0" y1="157.95" x2="210.0" y2="175.95" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,171.95 L210.0,181.95 L216.0,171.95 z" fill="#64748B"/><text x="222.0" y="174.95" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">change id</tspan></text><rect x="16" y="185.95" width="388" height="54.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="208.45" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">GET /invoice?id=1002</tspan><tspan x="210.0" dy="18.2">(someone else&#x27;s invoice)</tspan></text><text x="16" y="260.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Test every id in URLs, JSON bodies and cookies. Try</tspan><tspan x="
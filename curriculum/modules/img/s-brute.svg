<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 423" width="420" height="423" role="img" aria-label="Brute force without melting"><title>Brute force without melting</title><rect width="420" height="423" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Brute force without melting</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">search-space thinking</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Estimate the space: length × alphabet, or a</tspan><tspan x="210.0" dy="17.6">wordlist</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Prune: known prefix, charset, constraints</tspan></text><line x1="210.0" y1="226.14999999999998" x2="210.0" y2="244.14999999999998" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,240.14999999999998 L210.0,250.14999999999998 L216.0,240.14999999999998 z" fill="#64748B"/><rect x="16" y="254.14999999999998" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Parallelise only if it helps; keep it simple</tspan></text><line x1="210.0" y1="295.7" x2="210.0" y2="313.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,309.7 L210.0,319.7 L216.0,309.7 z" fill="#64748B"/><rect x="16" y="323.7" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="345.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Stop at the first hit; log progress</tspan></text><text x="16" y="379.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">10^4 is instant; 10^9 needs a smarter idea (oracle,</tspan><tspan x="16" dy="16.9">meet-in-the-middle, GPU).</tspan></text></svg>
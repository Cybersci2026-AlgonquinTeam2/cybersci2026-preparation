<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 415" width="420" height="415" role="img" aria-label="Mock exam time budget"><title>Mock exam time budget</title><rect width="420" height="415" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Mock exam time budget</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">60 minutes, no notes</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">A  Quick recall: 20 questions, 1 point each</tspan><tspan x="210.0" dy="17.6">10 minutes</tspan></text><rect x="16" y="158.6" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">B  Read the evidence: 10 questions, 3 points each</tspan><tspan x="210.0" dy="17.6">20 minutes</tspan></text><rect x="16" y="219.7" width="388" height="70.7" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="241.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">C  Decode and calculate: 6 questions, 5 points</tspan><tspan x="210.0" dy="17.6">each</tspan><tspan x="210.0" dy="17.6">20 minutes</tspan></text><rect x="16" y="298.35" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="320.35" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">D  Judgement: 4 questions, 5 points each</tspan><tspan x="210.0" dy="17.6">10 minutes</tspan></text><text x="16" y="371.95000000000005" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Total 100 points. Use the 30-minute rule inside the</tspan><tspan x="16" dy="16.9">exam too: skip and return.</tspan></text></svg>
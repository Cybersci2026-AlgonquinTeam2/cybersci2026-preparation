<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 355" width="420" height="355" role="img" aria-label="Sessions and JWT"><title>Sessions and JWT</title><rect width="420" height="355" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Sessions and JWT</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">who are you, according to the server?</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Cookie: session=abc123</tspan><tspan x="210.0" dy="16.9">server looks it up in its store</tspan></text><rect x="16" y="163.25" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="184.75" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">JWT = header . payload . signature</tspan><tspan x="210.0" dy="16.9">(three base64url parts)</tspan></text><rect x="16.0" y="223.0" width="124.0" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="78.0" y="244.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="78.0" dy="0">header</tspan><tspan x="78.0" dy="16.9">alg: HS256</tspan></text><rect x="148.0" y="223.0" width="124.0" height="51.8" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="244.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">payload</tspan><tspan x="210.0" dy="16.9">user, role, exp</tspan></text><rect x="280.0" y="223.0" width="124.0" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="342.0" y="244.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="342.0" dy="0">signature</tspan><tspan x="342.0" dy="16.9">HMAC(secret)</tspan></text><text x="16" y="295.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Attacks: alg:none, weak secret (hashcat -m 16500),</tspan><tspan x="16" dy="16.9">change role in payload if signature isn&#x27;t checked, kid</tspan><tspan x="16" dy="16.9">injection.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" aria-label="Reading a capture as a story"><title>Reading a capture as a story</title><rect width="420" height="458" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Reading a capture as a story</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">turn packets into a timeline</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">00:01 DNS lookup: files.corp.test</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">00:02 HTTP GET /tools/update.zip (200, 1.2 MB)</tspan></text><line x1="210.0" y1="208.60000000000002" x2="210.0" y2="226.60000000000002" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,222.60000000000002 L210.0,232.60000000000002 L216.0,222.60000000000002 z" fill="#64748B"/><rect x="16" y="236.60000000000002" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="258.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">00:09 FTP login as anonymous; STOR notes.txt</tspan></text><line x1="210.0" y1="278.15000000000003" x2="210.0" y2="296.15000000000003" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,292.15000000000003 L210.0,302.15000000000003 L216.0,292.15000000000003 z" fill="#64748B"/><rect x="16" y="306.15000000000003" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="328.15000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">00:14 DNS TXT queries with long random names</tspan></text><line x1="210.0" y1="347.70000000000005" x2="210.0" y2="365.70000000000005" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,361.70000000000005 L210.0,371.70000000000005 L216.0,361.70000000000005 z" fill="#64748B"/><rect x="16" y="375.70000000000005" width="388" height="35.5" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="397.70000000000005" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Story: download → run → staging → covert channel</tspan></text><text x="16" y="431.75000000000006" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Question first, then the filter that answers it.</tspan></text></svg>
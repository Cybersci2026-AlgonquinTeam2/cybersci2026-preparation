<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 562" width="420" height="562" role="img" aria-label="Packet capture workflow"><title>Packet capture workflow</title><rect width="420" height="562" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Packet capture workflow</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Wireshark / tshark</tspan></text><rect x="16" y="97.5" width="388" height="54.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1. Statistics → Protocol Hierarchy</tspan><tspan x="210.0" dy="18.2">what protocols exist?</tspan></text><line x1="210.0" y1="157.95" x2="210.0" y2="175.95" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,171.95 L210.0,181.95 L216.0,171.95 z" fill="#64748B"/><rect x="16" y="185.95" width="388" height="54.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="208.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2. Statistics → Conversations</tspan><tspan x="210.0" dy="18.2">who talks to whom, how much?</tspan></text><line x1="210.0" y1="246.39999999999998" x2="210.0" y2="264.4" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,260.4 L210.0,270.4 L216.0,260.4 z" fill="#64748B"/><rect x="16" y="274.4" width="388" height="54.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="296.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3. Filter: http, dns, ftp, tcp.stream eq 5</tspan><tspan x="210.0" dy="18.2">follow TCP stream</tspan></text><line x1="210.0" y1="334.84999999999997" x2="210.0" y2="352.84999999999997" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,348.84999999999997 L210.0,358.84999999999997 L216.0,348.84999999999997 z" fill="#64748B"/><rect x="16" y="362.84999999999997" width="388" height="54.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="385.34999999999997" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">4. Export Objects → HTTP/SMB</tspan><tspan x="210.0" dy="18.2">files that crossed the wire</tspan></text><line x1="210.0" y1="423.29999999999995" x2="210.0" y2="441.29999999999995" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,437.29999999999995 L210.0,447.29999999999995 L216.0,437.29999999999995 z" fill="#64748B"/><rect x="16" y="451.29999999999995" width="388" height="36.2" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="473.79999999999995" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">5. Look for creds, flags, odd DNS, big uploads</tspan></text><text x="16" y="506.525" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">tshark -r f.pcap -q -z io,phs   (hierarchy)</tspan><tspan x="16" dy="14.9">tshark -r f.pcap -Y http.request -T fields -e http.host -e</tspan><tspan x="16" dy="14.9">http.request.uri</tspan></text></svg>
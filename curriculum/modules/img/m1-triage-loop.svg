<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 685" width="420" height="685" role="img" aria-label="The CTF loop"><title>The CTF loop</title><rect width="420" height="685" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">The CTF loop</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">use it on every challenge</tspan></text><rect x="16" y="97.5" width="388" height="70.7" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1 OBSERVE</tspan><tspan x="210.0" dy="17.6">what exactly was given? run file / strings / curl</tspan><tspan x="210.0" dy="17.6">-i / nmap</tspan></text><line x1="210.0" y1="174.15" x2="210.0" y2="192.15" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,188.15 L210.0,198.15 L216.0,188.15 z" fill="#64748B"/><rect x="16" y="202.15" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="224.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2 CLASSIFY</tspan><tspan x="210.0" dy="17.6">category + likely technique in one sentence</tspan></text><line x1="210.0" y1="261.25" x2="210.0" y2="279.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,275.25 L210.0,285.25 L216.0,275.25 z" fill="#64748B"/><rect x="16" y="289.25" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="311.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3 HYPOTHESIZE</tspan><tspan x="210.0" dy="17.6">up to 3 causes, ranked</tspan></text><line x1="210.0" y1="348.35" x2="210.0" y2="366.35" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,362.35 L210.0,372.35 L216.0,362.35 z" fill="#64748B"/><rect x="16" y="376.35" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="398.35" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">4 SMALLEST TEST</tspan><tspan x="210.0" dy="17.6">one cheap command that separates them</tspan></text><line x1="210.0" y1="435.45000000000005" x2="210.0" y2="453.45000000000005" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,449.45000000000005 L210.0,459.45000000000005 L216.0,449.45000000000005 z" fill="#64748B"/><rect x="16" y="463.45000000000005" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="485.45000000000005" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">5 VERIFY</tspan><tspan x="210.0" dy="17.6">confirm flag format; test independently</tspan></text><line x1="210.0" y1="522.5500000000001" x2="210.0" y2="540.5500000000001" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,536.5500000000001 L210.0,546.5500000000001 L216.0,536.5500000000001 z" fill="#64748B"/><rect x="16" y="550.5500000000001" width="388" height="70.7" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="572.5500000000001" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">6 RECORD</tspan><tspan x="210.0" dy="17.6">5-line writeup: what, first observation,</tspan><tspan x="210.0" dy="17.6">technique, tool, mistake</tspan></text><text x="16" y="641.7" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Stuck for 30 minutes? Swap or ask. Note where you gave</tspan><tspan x="16" dy="16.9">up.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 417" width="420" height="417" role="img" aria-label="The stack"><title>The stack</title><rect width="420" height="417" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">The stack</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">why buffer overflows work</tspan></text><rect x="16" y="97.5" width="388" height="34.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="118.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">high addresses</tspan></text><rect x="16" y="139.7" width="388" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">return address</tspan><tspan x="210.0" dy="16.9">(where the function goes back to)</tspan></text><rect x="16" y="199.45" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="220.95" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">saved rbp</tspan></text><rect x="16" y="242.325" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="263.825" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">char buf[64]</tspan><tspan x="210.0" dy="16.9">(your input is copied here)</tspan></text><rect x="16" y="302.075" width="388" height="34.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="323.075" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">low addresses</tspan></text><text x="16" y="356.775" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Writing more than 64 bytes grows UPWARD and overwrites</tspan><tspan x="16" dy="16.9">saved rbp, then the return address. You choose where</tspan><tspan x="16" dy="16.9">the function returns.</tspan></text></svg>
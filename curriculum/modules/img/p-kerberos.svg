<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 383" width="420" height="383" role="img" aria-label="Kerberos in one picture"><title>Kerberos in one picture</title><rect width="420" height="383" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Kerberos in one picture</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Active Directory authentication</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1  AS-REQ → KDC (domain controller)</tspan><tspan x="210.0" dy="16.9">    you prove identity → get a TGT</tspan></text><rect x="16" y="157.25" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2  TGS-REQ with TGT → KDC</tspan><tspan x="210.0" dy="16.9">    ask for a ticket for a service (SPN)</tspan></text><rect x="16" y="217.0" width="388" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="238.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3  present service ticket → the service</tspan><tspan x="210.0" dy="16.9">    it decrypts with ITS account&#x27;s key</tspan></text><text x="16" y="289.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Kerberoasting: any user can request tickets for SPNs;</tspan><tspan x="16" dy="16.9">the ticket is encrypted with the service account</tspan><tspan x="16" dy="16.9">password → crack offline.</tspan><tspan x="16" dy="16.9">AS-REP roasting: accounts without pre-auth leak a</tspan><tspan x="16" dy="16.9">crackable blob.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 343" width="420" height="343" role="img" aria-label="A safe home lab"><title>A safe home lab</title><rect width="420" height="343" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">A safe home lab</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">keep attacks inside it</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Your laptop (host)</tspan></text><line x1="210.0" y1="139.725" x2="210.0" y2="157.725" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.725 L210.0,163.725 L216.0,153.725 z" fill="#64748B"/><text x="222.0" y="156.725" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">VMware host-only / NAT</tspan></text><rect x="16.0" y="167.725" width="190.0" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="111.0" y="189.225" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">Kali (attacker)</tspan></text><rect x="214.0" y="167.725" width="190.0" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="309.0" y="189.225" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">Targets: Juice Shop,</tspan><tspan x="309.0" dy="16.9">DVWA, VulnHub VMs</tspan></text><rect x="16.0" y="22
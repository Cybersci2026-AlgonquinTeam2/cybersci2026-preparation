<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 336" width="420" height="336" role="img" aria-label="OSINT ethics line"><title>OSINT ethics line</title><rect width="420" height="336" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">OSINT ethics line</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">where the line is</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">OK: public posts, public records, maps, archives;</tspan><tspan x="210.0" dy="17.6">for a defined, legitimate question</tspan></text><rect x="16" y="158.6" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">CAREFUL: private individuals, minors, medical or</tspan><tspan x="210.0" dy="17.6">financial data; minimise and redact</tspan></text><rect x="16" y="219.7" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="241.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">NO: hacking accounts, doxxing, stalking, social-</tspan><tspan x="210.0" dy="17.6">engineering real people</tspan></text><text x="16" y="293.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">CTF OSINT uses fictional or opt-in targets. Treat real</tspan><tspan x="16" dy="16.9">people with care even then.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 405" width="420" height="405" role="img" aria-label="Virtual hosts"><title>Virtual hosts</title><rect width="420" height="405" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Virtual hosts</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">one IP, many websites</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Browser asks the IP for &#x27;warmup.example&#x27;</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Server picks the site by the Host header</tspan></text><line x1="210.0" y1="208.60000000000002" x2="210.0" y2="226.60000000000002" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,222.60000000000002 L210.0,232.60000000000002 L216.0,222.60000000000002 z" fill="#64748B"/><rect x="16" y="236.60000000000002" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="258.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">You send Host: internal.example instead</tspan></text><line x1="210.0" y1="278.15000000000003" x2="210.0" y2="296.15000000000003" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,292.15000000000003 L210.0,302.15000000000003 L216.0,292.15000000000003 z" fill="#64748B"/><rect x="16" y="306.15000000000003" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="328.15000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">The hidden site answers; flag is there</tspan></text><text x="16" y="362.20000000000005" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Clue source: names in the TLS certificate or page</tspan><tspan x="16" dy="16.9">source.</tspan></text></svg>
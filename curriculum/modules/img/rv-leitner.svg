<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 371" width="420" height="371" role="img" aria-label="Leitner boxes"><title>Leitner boxes</title><rect width="420" height="371" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Leitner boxes</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">spaced repetition on paper or in Anki</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Box 1: every day</tspan></text><rect x="16" y="141.05" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="163.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Box 2: every 3 days</tspan></text><rect x="16" y="184.60000000000002" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.60000000000002" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Box 3: every week</tspan></text><rect x="16" y="228.15000000000003" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="250.15000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Box 4: every 2 weeks</tspan></text><rect x="16" y="271.70000000000005" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="293.70000000000005" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Box 5: monthly → graduated</tspan></text><text x="16" y="327.75000000000006" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Correct → move up a box. Wrong → back to box 1. 15 new</tspan><tspan x="16" dy="16.9">cards/day is plenty.</tspan></text></svg>
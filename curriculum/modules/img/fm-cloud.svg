<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 336" width="420" height="336" role="img" aria-label="Cloud shared responsibility"><title>Cloud shared responsibility</title><rect width="420" height="336" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Cloud shared responsibility</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">who secures what</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">PROVIDER: physical, hardware, hypervisor, managed-</tspan><tspan x="210.0" dy="17.6">service internals</tspan></text><rect x="16" y="158.6" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">SHARED: identity, network config, patching</tspan><tspan x="210.0" dy="17.6">(varies: IaaS/PaaS/SaaS)</tspan></text><rect x="16" y="219.7" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="241.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">YOU: data, accounts and keys, configuration,</tspan><tspan x="210.0" dy="17.6">access policies</tspan></text><text x="16" y="293.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Most cloud breaches are customer misconfigurations:</tspan><tspan x="16" dy="16.9">public storage, over-broad IAM, leaked keys.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 362" width="420" height="362" role="img" aria-label="The 30-minute rule"><title>The 30-minute rule</title><rect width="420" height="362" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">The 30-minute rule</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">time-box every challenge</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">0-10 min   read ALL challenge titles; rank points</tspan><tspan x="210.0" dy="17.6">÷ estimated minutes</tspan></text><rect x="16" y="158.6" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">10-40 min  attack the best ratio; solo</tspan></text><rect x="16" y="202.14999999999998" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="224.14999999999998" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">40 min     STOP: write what you know, hand off or</tspan><tspan x="210.0" dy="17.6">switch</tspan></text><rect x="16" y="263.25" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="285.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Every hour  look at the scoreboard; re-rank</tspan></text><text x="16" y="319.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Warmups are cheap points: clear them first (the 2022</tspan><tspan x="16" dy="16.9">regionals had ~9 of them, down to 1-5 points each).</tspan></text></svg>
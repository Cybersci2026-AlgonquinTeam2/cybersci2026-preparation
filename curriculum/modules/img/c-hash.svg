<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 374" width="420" height="374" role="img" aria-label="Hashes"><title>Hashes</title><rect width="420" height="374" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Hashes</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">one-way, fixed size</tspan></text><rect x="16" y="97.5" width="388" height="34.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="118.5" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">md5 32 hex · sha1 40 hex · sha256 64 hex</tspan></text><rect x="16" y="139.7" width="388" height="51.8" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Same input → same hash. Tiny change → totally</tspan><tspan x="210.0" dy="16.9">different hash.</tspan></text><rect x="16" y="199.45" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="220.95" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Crack: hashcat / john + wordlist + rules</tspan></text><rect x="16" y="242.325" width="388" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="263.825" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Length extension: H(secret‖msg) lets you append data</tspan><tspan x="210.0" dy="16.9">(md5/sha1/sha256, not HMAC)</tspan></text><text x="16" y="314.575" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Identify: hashid, hash-identifier, length + charset.</tspan><tspan x="16" dy="16.9">Salted hashes: unique per user, same wordlist but</tspan><tspan x="16" dy="16.9">slower.</tspan></text></svg>
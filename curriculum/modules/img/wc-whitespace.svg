<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 329" width="420" height="329" role="img" aria-label="Whitespace binary"><title>Whitespace binary</title><rect width="420" height="329" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Whitespace binary</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">two symbols, eight bits per letter</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">space = 0   tab = 1</tspan></text><rect x="16" y="141.05" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="163.55" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">01000011 → 67 → &#x27;C&#x27;</tspan></text><rect x="16" y="185.275" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="207.775" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">01010100 → 84 → &#x27;T&#x27;</tspan></text><rect x="16" y="229.5" width="388" height="36.2" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="252.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">01000110 → 70 → &#x27;F&#x27;</tspan></text><text x="16" y="286.225" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Tell-tale: only two distinct byte values (0x20, 0x09).</tspan><tspan x="16" dy="16.9">xxd -p f | fold -w2 | sort | uniq -c</tspan></text></svg>
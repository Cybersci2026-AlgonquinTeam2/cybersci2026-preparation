<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 404" width="420" height="404" role="img" aria-label="HTTP request and response"><title>HTTP request and response</title><rect width="420" height="404" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">HTTP request and response</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">know both halves</tspan></text><rect x="16" y="97.5" width="388" height="96.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="118.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">GET /search?q=cat HTTP/1.1</tspan><tspan x="210.0" dy="15.5">Host: shop.example</tspan><tspan x="210.0" dy="15.5">Cookie: session=abc123</tspan><tspan x="210.0" dy="15.5">User-Agent: …</tspan></text><text x="210.0" y="179.39999999999998" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">REQUEST: method, path, headers, body</tspan></text><line x1="210.0" y1="200.425" x2="210.0" y2="218.425" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,214.425 L210.0,224.425 L216.0,214.425 z" fill="#64748B"/><rect x="16" y="228.425" width="388" height="112.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="248.925" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">HTTP/1.1 200 OK</tspan><tspan x="210.0" dy="15.5">Set-Cookie: session=…</tspan><tspan x="210.0" dy="15.5">Content-Type: text/html</tspan><tspan x="210.0" dy="15.5"></tspan><tspan x="210.0" dy="15.5">&lt;html&gt;…&lt;/html&gt;</tspan></text><text x="210.0" y="325.85" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">RESPONSE: status, headers, body</tspan></text><text x="16" y="361.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Everything the browser sends is attacker-controlled:</tspan><tspan x="16" dy="16.9">path, query, headers, cookies, body.</tspan></text></svg>
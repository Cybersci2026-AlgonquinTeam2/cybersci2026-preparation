<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 284" width="420" height="284" role="img" aria-label="ret2win"><title>ret2win</title><rect width="420" height="284" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">ret2win</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">the simplest exploit</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">normal:  main → vuln() → returns to main</tspan></text><rect x="16" y="141.05" width="388" height="35.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="163.05" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">attack:  input = &#x27;A&#x27;×offset + address_of(win)</tspan></text><rect x="16" y="184.60000000000002" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="206.60000000000002" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">vuln() returns → jumps to win() → prints the flag</tspan></text><text x="16" y="240.65000000000003" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Steps: checksec → find offset (cyclic pattern) → find</tspan><tspan x="16" dy="16.9">win address → send payload with pwntools.</tspan></text></svg>
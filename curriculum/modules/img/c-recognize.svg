<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 557" width="420" height="557" role="img" aria-label="What is this string?"><title>What is this string?</title><rect width="420" height="557" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">What is this string?</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">recognition cheat flow</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Only A-Z a-z 0-9 + / and ends with =  →  base64</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Only 0-9 a-f, even length  →  hex  (xxd -r -p)</tspan></text><line x1="210.0" y1="208.60000000000002" x2="210.0" y2="226.60000000000002" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,222.60000000000002 L210.0,232.60000000000002 L216.0,222.60000000000002 z" fill="#64748B"/><rect x="16" y="236.60000000000002" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="258.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Looks like English with wrong letters  →  ROT13 /</tspan><tspan x="210.0" dy="17.6">Caesar</tspan></text><line x1="210.0" y1="295.70000000000005" x2="210.0" y2="313.70000000000005" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,309.70000000000005 L210.0,319.70000000000005 L216.0,309.70000000000005 z" fill="#64748B"/><rect x="16" y="323.70000000000005" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="345.70000000000005" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Starts eyJ…  →  JWT (base64url JSON)</tspan></text><line x1="210.0" y1="365.25000000000006" x2="210.0" y2="383.25000000000006" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,379.25000000000006 L210.0,389.25000000000006 L216.0,379.25000000000006 z" fill="#64748B"/><rect x="16" y="393.25000000000006" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="415.25000000000006" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">32/40/64 hex characters  →  md5 / sha1 / sha256</tspan><tspan x="210.0" dy="17.6">hash</tspan></text><line x1="210.0" y1="452.3500000000001" x2="210.0" y2="470.3500000000001" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,466.3500000000001 L210.0,476.3500000000001 L216.0,466.3500000000001 z" fill="#64748B"/><rect x="16" y="480.3500000000001" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="502.3500000000001" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Starts 1f8b / 504b / 425a  →  gzip / zip / bzip2</tspan><tspan x="210.0" dy="17.6">file</tspan></text></svg>
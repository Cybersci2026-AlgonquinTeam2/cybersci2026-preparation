<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 579" width="420" height="579" role="img" aria-label="A multi-stage chain"><title>A multi-stage chain</title><rect width="420" height="579" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">A multi-stage chain</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Nationals 2021 &#x27;Command and Control&#x27; shape</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Recon: chatbot leaks hints → VPN credentials</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Scan: service with a known remote-code flaw</tspan></text><line x1="210.0" y1="208.60000000000002" x2="210.0" y2="226.60000000000002" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,222.60000000000002 L210.0,232.60000000000002 L216.0,222.60000000000002 z" fill="#64748B"/><rect x="16" y="236.60000000000002" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="258.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Foothold: shell; find the C2 program</tspan></text><line x1="210.0" y1="278.15000000000003" x2="210.0" y2="296.15000000000003" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,292.15000000000003 L210.0,302.15000000000003 L216.0,292.15000000000003 z" fill="#64748B"/><rect x="16" y="306.15000000000003" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="328.15000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Reverse: decompile the Python; see what the check</tspan><tspan x="210.0" dy="17.6">does</tspan></text><line x1="210.0" y1="365.25000000000006" x2="210.0" y2="383.25000000000006" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,379.25000000000006 L210.0,389.25000000000006 L216.0,379.25000000000006 z" fill="#64748B"/><rect x="16" y="393.25000000000006" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="415.25000000000006" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Crypto: sign the shutdown message with the found</tspan><tspan x="210.0" dy="17.6">key</tspan></text><line x1="210.0" y1="452.3500000000001" x2="210.0" y2="470.3500000000001" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,466.3500000000001 L210.0,476.3500000000001 L216.0,466.3500000000001 z" fill="#64748B"/><rect x="16" y="480.3500000000001" width="388" height="35.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="502.3500000000001" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Flag: the termination code</tspan></text><text x="16" y="536.4000000000001" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Real engagements look like this: small wins</tspan><tspan x="16" dy="16.9">compounding.</tspan></text></svg>
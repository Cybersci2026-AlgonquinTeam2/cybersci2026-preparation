<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 550" width="420" height="550" role="img" aria-label="The cybersecurity field"><title>The cybersecurity field</title><rect width="420" height="550" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">The cybersecurity field</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">five neighbourhoods, one shared foundation</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">OFFENSE (find weaknesses)</tspan><tspan x="210.0" dy="17.6">pentest · red team · exploit research · bug bounty</tspan></text><rect x="16" y="158.6" width="388" height="70.7" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">DEFENSE (detect and respond)</tspan><tspan x="210.0" dy="17.6">SOC · incident response · threat hunting · DFIR ·</tspan><tspan x="210.0" dy="17.6">threat intel</tspan></text><rect x="16" y="237.25" width="388" height="70.7" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="259.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ENGINEERING (build it secure)</tspan><tspan x="210.0" dy="17.6">appsec · cloud security · network security · IAM ·</tspan><tspan x="210.0" dy="17.6">crypto/PKI</tspan></text><rect x="16" y="315.9" width="388" height="70.7" rx=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" role="img" aria-label="Cloud IAM in one line"><title>Cloud IAM in one line</title><rect width="420" height="440" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Cloud IAM in one line</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">who may do what to which resource</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">PRINCIPAL: user, role, service account,</tspan><tspan x="210.0" dy="17.6">application</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">POLICY: allow/deny actions (read, write, delete,</tspan><tspan x="210.0" dy="17.6">assume)</tspan></text><line x1="210.0" y1="243.7" x2="210.0" y2="261.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,257.7 L210.0,267.7 L216.0,257.7 z" fill="#64748B"/><rect x="16" y="271.7" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="293.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">RESOURCE: bucket, VM, database, secret, key</tspan></text><line x1="210.0" y1="313.25" x2="210.0" y2="331.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,327.25 L210.0,337.25 L216.0,327.25 z" fill="#64748B"/><rect x="16" y="341.25" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="363.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">CONDITION: from where, when, with MFA?</tspan></text><text x="16" y="397.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Over-broad policies (Action: *, Resource: *) are the</tspan><tspan x="16" dy="16.9">most common finding.</tspan></text></svg>
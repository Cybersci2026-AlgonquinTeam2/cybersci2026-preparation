<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 397" width="420" height="397" role="img" aria-label="What your score means"><title>What your score means</title><rect width="420" height="397" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">What your score means</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">and what to do next</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">85-100  Competition-ready: keep timing yourself</tspan><tspan x="210.0" dy="17.6">and rehearse team roles</tspan></text><rect x="16" y="158.6" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">70-84  Solid: patch the two weakest categories</tspan><tspan x="210.0" dy="17.6">this week</tspan></text><rect x="16" y="219.7" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="241.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">50-69  Developing: redo the modules for every</tspan><tspan x="210.0" dy="17.6">category you missed</tspan></text><rect x="16" y="280.8" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="302.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">under 50  Foundation first: Bandit 0-20, module 1,</tspan><tspan x="210.0" dy="17.6">cheat sheets, then retake</tspan></text><text x="16" y="354.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Retake after 3 days with the answer key closed; track</tspan><tspan x="16" dy="16.9">the delta, not just the score.</tspan></text></svg>
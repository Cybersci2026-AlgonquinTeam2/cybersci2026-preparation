<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 387" width="420" height="387" role="img" aria-label="Three kinds of XSS"><title>Three kinds of XSS</title><rect width="420" height="387" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Three kinds of XSS</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">script runs in someone else&#x27;s browser</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">REFLECTED  payload in the URL/request is echoed</tspan><tspan x="210.0" dy="17.6">back immediately</tspan></text><rect x="16" y="158.6" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">STORED  payload saved by the server (comment,</tspan><tspan x="210.0" dy="17.6">profile), hits every viewer</tspan></text><rect x="16" y="219.7" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="241.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">DOM  client-side JS writes your input into the</tspan><tspan x="210.0" dy="17.6">page unsafely</tspan></text><text x="16" y="293.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Test: &lt;script&gt;alert(1)&lt;/script&gt;, &quot;&gt;&lt;svg</tspan><tspan x="16" dy="16.9">onload=alert(1)&gt;, then adapt to the context (HTML,</tspan><tspan x="16" dy="16.9">attribute, JS string).</tspan><tspan x="16" dy="16.9">Goal in CTFs: steal a cookie or call an admin-only</tspan><tspan x="16" dy="16.9">endpoint.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 389" width="420" height="389" role="img" aria-label="CIA triad"><title>CIA triad</title><rect width="420" height="389" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">CIA triad</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">what security protects</tspan></text><rect x="16" y="97.5" width="388" height="70.7" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">CONFIDENTIALITY</tspan><tspan x="210.0" dy="17.6">only the right people can read it</tspan><tspan x="210.0" dy="17.6">(encryption, access control)</tspan></text><rect x="16" y="176.15" width="388" height="70.7" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="198.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">INTEGRITY</tspan><tspan x="210.0" dy="17.6">it has not been altered</tspan><tspan x="210.0" dy="17.6">(hashes, signatures, change control)</tspan></text><rect x="16" y="254.8" width="388" height="70.7" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">AVAILABILITY</tspan><tspan x="210.0" dy="17.6">it works when needed</tspan><tspan x="210.0" dy="17.6">(backups, redundancy, DDoS defence)</tspan></text><text x="16" y="345.95000000000005" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Every attack and every control maps back to one of</tspan><tspan x="16" dy="16.9">these three.</tspan></text></svg>
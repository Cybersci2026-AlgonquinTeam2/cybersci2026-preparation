<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 393" width="420" height="393" role="img" aria-label="Oracle leak"><title>Oracle leak</title><rect width="420" height="393" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Oracle leak</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">CyberSci 2022 &#x27;String Storage&#x27; shape</tspan></text><rect x="16" y="97.5" width="388" height="34.9" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Secret sits right after your data in memory</tspan></text><rect x="16" y="140.375" width="388" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="161.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">search(prefix) answers FOUND / NOT FOUND</tspan><tspan x="210.0" dy="16.9">but compares one byte too many</tspan></text><line x1="210.0" y1="198.125" x2="210.0" y2="216.125" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,212.125 L210.0,222.125 L216.0,212.125 z" fill="#64748B"/><rect x="16" y="226.125" width="388" height="34.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="247.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">guess the next character c: is prefix+c FOUND?</tspan></text><line x1="210.0" y1="267.0" x2="210.0" y2="285.0" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,281.0 L210.0,291.0 L216.0,281.0 z" fill="#64748B"/><text x="222.0" y="284.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">repeat per position</tspan></text><rect x="16" y="295.0" width="388" height="34.9" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="316.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">secret recovered one character at a time</tspan></text><text x="16" y="350.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Cost: length × alphabet size, not alphabet size to the</tspan><tspan x="16" dy="16.9">power of length.</tspan></text></svg>
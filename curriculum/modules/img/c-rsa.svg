<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 478" width="420" height="478" role="img" aria-label="RSA at a glance"><title>RSA at a glance</title><rect width="420" height="478" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">RSA at a glance</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">know the parts, then the attacks</tspan></text><rect x="16" y="97.5" width="388" height="68.6" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">n = p × q   (public)</tspan><tspan x="210.0" dy="16.9">e = 65537  (public)</tspan><tspan x="210.0" dy="16.9">d = e⁻¹ mod φ(n)  (private)</tspan></text><rect x="16" y="174.125" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="195.625" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">encrypt: c = mᵉ mod n</tspan><tspan x="210.0" dy="16.9">decrypt: m = cᵈ mod n</tspan></text><text x="16" y="246.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Attack decision:</tspan></text><rect x="16" y="256.375" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="277.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">n small / factorable → factordb, yafu</tspan></text><rect x="16" y="299.25" width="388" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="320.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">e tiny (3) and m small → c is just mᵉ: take the e-th</tspan><tspan x="210.0" dy="16.9">root</tspan></text><rect x="16" y="359.0" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="380.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">same n, two e → common modulus</tspan></text><rect x="16" y="401.875" width="388" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="423.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">d small → Wiener; p≈q → Fermat; shared prime across</tspan><tspan x="210.0" dy="16.9">keys → gcd</tspan></text></svg>
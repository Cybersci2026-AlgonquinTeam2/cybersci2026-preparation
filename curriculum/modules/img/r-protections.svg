<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 395" width="420" height="395" role="img" aria-label="Binary protections"><title>Binary protections</title><rect width="420" height="395" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Binary protections</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">checksec tells you</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">NX: stack not executable → no shellcode on stack</tspan><tspan x="210.0" dy="16.9">(use ROP)</tspan></text><rect x="16" y="157.25" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Stack canary: random value before return address →</tspan><tspan x="210.0" dy="16.9">leak or avoid overwriting it</tspan></text><rect x="16" y="217.0" width="388" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="238.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ASLR: libraries/stack at random addresses → need an</tspan><tspan x="210.0" dy="16.9">info leak</tspan></text><rect x="16" y="276.75" width="388" height="51.8" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="298.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">PIE: program itself at random base → leak a code</tspan><tspan x="210.0" dy="16.9">pointer</tspan></text><rect x="16" y="336.5" width="388" height="34.9" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">RELRO: Full RELRO: GOT read-only → no GOT overwrite</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 562" width="420" height="562" role="img" aria-label="Investigating a domain"><title>Investigating a domain</title><rect width="420" height="562" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Investigating a domain</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">all public sources</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">WHOIS / RDAP: registrar, dates, contacts (often</tspan><tspan x="210.0" dy="17.6">redacted)</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">DNS: A, MX, TXT, NS records; subdomains</tspan></text><line x1="210.0" y1="226.14999999999998" x2="210.0" y2="244.14999999999998" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,240.14999999999998 L210.0,250.14999999999998 L216.0,240.14999999999998 z" fill="#64748B"/><rect x="16" y="254.14999999999998" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Certificate transparency (crt.sh): names issued</tspan><tspan x="210.0" dy="17.6">for the domain</tspan></text><line x1="210.0" y1="313.25" x2="210.0" y2="331.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,327.25 L210.0,337.25 L216.0,327.25 z" fill="#64748B"/><rect x="16" y="341.25" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="363.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Wayback Machine: old pages, removed files</tspan></text><line x1="210.0" y1="382.8" x2="210.0" y2="400.8" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,396.8 L210.0,406.8 L216.0,396.8 z" fill="#64748B"/><rect x="16" y="410.8" width="388" height="35.5" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="432.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Search engines: dorks for exposed documents</tspan></text><line x1="210.0" y1="452.35" x2="210.0" y2="470.35" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,466.35 L210.0,476.35 L216.0,466.35 z" fill="#64748B"/><rect x="16" y="480.35" width="388" height="35.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="502.35" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Metadata: exiftool on downloaded files</tspan></text><text x="16" y="536.4" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Example dork: site:example.com filetype:pdf</tspan></text></svg>
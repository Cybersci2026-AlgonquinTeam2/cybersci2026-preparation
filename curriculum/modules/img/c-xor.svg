<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" width="420" height="350" role="img" aria-label="XOR in four lines"><title>XOR in four lines</title><rect width="420" height="350" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">XOR in four lines</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">the most common CTF primitive</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">plaintext  XOR  key  =  ciphertext</tspan></text><rect x="16" y="141.725" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="164.225" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ciphertext XOR  key  =  plaintext</tspan></text><rect x="16" y="185.95" width="388" height="50.4" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="206.95" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ciphertext XOR plaintext = key   (known-plaintext</tspan><tspan x="210.0" dy="16.2">attack)</tspan></text><text x="16" y="256.85" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Single-byte key: try all 256, score by English letters.</tspan><tspan x="16" dy="16.9">Repeating key: find key length (Hamming distance), then</tspan><tspan x="16" dy="16.9">solve each column.</tspan><tspan x="16" dy="16.9">Flag format known (e.g. CTF{...}) → recover key bytes</tspan><tspan x="16" dy="16.9">from the first characters.</tspan></text></svg>
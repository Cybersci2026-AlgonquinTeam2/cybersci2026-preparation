<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 481" width="420" height="481" role="img" aria-label="File magic bytes"><title>File magic bytes</title><rect width="420" height="481" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">File magic bytes</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">first bytes identify the format</tspan></text><rect x="16" y="97.5" width="388" height="34.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1f 8b  →  gzip</tspan></text><rect x="16" y="138.375" width="388" height="34.9" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="159.875" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">42 5a 68  (BZh)  →  bzip2</tspan></text><rect x="16" y="179.25" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="200.75" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">50 4b 03 04  →  zip / docx / jar / apk</tspan></text><rect x="16" y="220.125" width="388" height="34.9" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="241.625" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">7f 45 4c 46  (ELF)  →  Linux executable</tspan></text><rect x="16" y="261.0" width="388" height="34.9" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="282.5" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">4d 5a  (MZ)  →  Windows PE (exe/dll)</tspan></text><rect x="16" y="301.875" width="388" height="34.9" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="323.375" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">89 50 4e 47  →  PNG image</tspan></text><rect x="16" y="342.75" width="388" height="34.9" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="364.25" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ff d8 ff  →  JPEG image</tspan></text><rect x="16" y="383.625" width="388" height="34.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="405.125" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">25 50 44 46  (%PDF)  →  PDF</tspan></text><rect x="16" y="424.5" width="388" height="34.9" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="446.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">75 73 74 61 72  (ustar)  →  tar at offset 257</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 366" width="420" height="366" role="img" aria-label="RSA with a tiny modulus"><title>RSA with a tiny modulus</title><rect width="420" height="366" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">RSA with a tiny modulus</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">why factoring breaks it</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">n = 3233 (public)</tspan></text><line x1="210.0" y1="139.725" x2="210.0" y2="157.725" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.725 L210.0,163.725 L216.0,153.725 z" fill="#64748B"/><text x="222.0" y="156.725" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">factor (easy when small)</tspan></text><rect x="16" y="167.725" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="190.225" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">p = 61 , q = 53</tspan></text><line x1="210.0" y1="209.95" x2="210.0" y2="227.95" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,223.95 L210.0,233.95 L216.0,223.95 z" fill="#64748B"/><text x="222.0" y="226.95" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">φ = 60 × 52 = 3120</tspan></text><rect x="16" y="237.95" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="259.45" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">d = 17⁻¹ mod 3120 = 2753</tspan></text><line x1="210.0" y1="278.825" x2="210.0" y2="296.825" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,292.825 L210.0,302.825 L216.0,292.825 z" fill="#64748B"/><text x="222.0" y="295.825" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">m = c^d mod n</tspan></text><rect x="16" y="306.825" width="388" height="34.9" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="328.325" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2790^2753 mod 3233 = 65 → &#x27;A&#x27;</tspan></text></svg>
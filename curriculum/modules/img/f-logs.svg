<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 313" width="420" height="313" role="img" aria-label="Reading a log line"><title>Reading a log line</title><rect width="420" height="313" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Reading a log line</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">auth.log / web access log</tspan></text><rect x="16" y="97.5" width="388" height="49.0" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="118.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Oct 14 03:12:07 srv sshd[812]: Failed password for</tspan><tspan x="210.0" dy="15.5">root from 203.0.113.9 port 51422</tspan></text><rect x="16.0" y="154.55" width="124.0" height="34.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="78.0" y="176.05" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="78.0" dy="0">time</tspan></text><rect x="148.0" y="154.55" width="124.0" height="34.9" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="176.05" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">host</tspan></text><rect x="280.0" y="154.55" width="124.0" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="342.0" y="176.05" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="342.0" dy="0">process</tspan></text><rect x="16.0" y="197.425" width="124.0" height="34.9" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="78.0" y="218.925" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="78.0" dy="0">event</tspan></text><rect x="148.0" y="197.425" width="124.0" height="34.9" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="218.925" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">user</tspan></text><rect x="280.0" y="197.425" width="124.0" height="34.9" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="342.0" y="218.925" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="342.0" dy="0">source IP</tspan></text><text x="16" y="252.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Method: grep an indicator → sort by time → build a</tspan><tspan x="16" dy="16.9">timeline → find first/last event.</tspan><tspan x="16" dy="16.9">sort | uniq -c | sort -rn  finds the noisiest source.</tspan></text></svg>
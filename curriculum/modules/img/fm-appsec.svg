<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 488" width="420" height="488" role="img" aria-label="Secure software lifecycle"><title>Secure software lifecycle</title><rect width="420" height="488" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Secure software lifecycle</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">shift security left</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Requirements: abuse cases, data classification</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Design: threat modelling (STRIDE), trust</tspan><tspan x="210.0" dy="17.6">boundaries</tspan></text><line x1="210.0" y1="226.15" x2="210.0" y2="244.15" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,240.15 L210.0,250.15 L216.0,240.15 z" fill="#64748B"/><rect x="16" y="254.15" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Build: secure coding, secrets management, SAST,</tspan><tspan x="210.0" dy="17.6">dependency scanning</tspan></text><line x1="210.0" y1="313.25" x2="210.0" y2="331.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,327.25 L210.0,337.25 L216.0,327.25 z" fill="#64748B"/><rect x="16" y="341.25" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="363.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Test: DAST, fuzzing, code review, pentest</tspan></text><line x1="210.0" y1="382.8" x2="210.0" y2="400.8" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,396.8 L210.0,406.8 L216.0,396.8 z" fill="#64748B"/><rect x="16" y="410.8" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="432.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Release and run: logging, WAF, patching, incident</tspan><tspan x="210.0" dy="17.6">response</tspan></text></svg>
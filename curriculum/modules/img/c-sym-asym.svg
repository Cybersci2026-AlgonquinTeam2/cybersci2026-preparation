<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 275" width="420" height="275" role="img" aria-label="Symmetric vs asymmetric"><title>Symmetric vs asymmetric</title><rect width="420" height="275" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Symmetric vs asymmetric</tspan></text><rect x="16.0" y="65.0" width="190.0" height="85.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="111.0" y="86.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">SYMMETRIC</tspan><tspan x="111.0" dy="16.9">one shared key</tspan><tspan x="111.0" dy="16.9">AES, ChaCha20</tspan><tspan x="111.0" dy="16.9">fast, bulk data</tspan></text><rect x="214.0" y="65.0" width="190.0" height="85.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="309.0" y="86.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">ASYMMETRIC</tspan><tspan x="309.0" dy="16.9">public + private</tspan><tspan x="309.0" dy="16.9">RSA, ECC</tspan><tspan x="309.0" dy="16.9">keys, signatures</tspan></text><text x="16" y="171.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Real protocols (TLS) use asymmetric to agree a key,</tspan><tspan x="16" dy="16.9">then symmetric for the data.</tspan></text><rect x="16" y="197.875" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="219.875" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Encoding ≠ encryption: base64, hex, URL-encoding</tspan><tspan x="210.0" dy="17.6">have no key.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 397" width="420" height="397" role="img" aria-label="Certification ladder"><title>Certification ladder</title><rect width="420" height="397" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Certification ladder</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">check current requirements before booking</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">START: Security+ · Network+ · CCNA (you are</tspan><tspan x="210.0" dy="17.6">studying)</tspan></text><rect x="16" y="158.6" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">PRACTICAL ENTRY: eJPT · PNPT · BTL1 · CompTIA</tspan><tspan x="210.0" dy="17.6">CySA+/PenTest+</tspan></text><rect x="16" y="219.7" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="241.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">INTERMEDIATE: OSCP · GCIH · GCFA · cloud security</tspan><tspan x="210.0" dy="17.6">(AWS/Azure)</tspan></text><rect x="16" y="280.8" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="302.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ADVANCED/MANAGEMENT: CISSP · CISM · OSEP · GXPN ·</tspan><tspan x="210.0" dy="17.6">CCSP</tspan></text><text x="16" y="354.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Certs open doors; portfolios (labs, CTFs, writeups)</tspan><tspan x="16" dy="16.9">prove skill. Employers at CyberSci watch both.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 408" width="420" height="408" role="img" aria-label="Talking to a service"><title>Talking to a service</title><rect width="420" height="408" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Talking to a service</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">sockets and pwntools in one picture</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">your script</tspan></text><line x1="210.0" y1="139.725" x2="210.0" y2="157.725" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.725 L210.0,163.725 L216.0,153.725 z" fill="#64748B"/><text x="222.0" y="156.725" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">remote(&#x27;host&#x27;, 1337)</tspan></text><rect x="16" y="167.725" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="190.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">service: banner, prompt, menu</tspan></text><line x1="210.0" y1="209.95" x2="210.0" y2="227.95" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,223.95 L210.0,233.95 L216.0,223.95 z" fill="#64748B"/><text x="222.0" y="226.95" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">recvuntil(b&#x27;&gt; &#x27;)</tspan></text><rect x="16" y="237.95" width="388" height="36.2" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="260.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">parse the prompt (regex / split)</tspan></text><line x1="210.0" y1="280.175" x2="210.0" y2="298.175" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,294.175 L210.0,304.175 L216.0,294.175 z" fill="#64748B"/><text x="222.0" y="297.175" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">sendline(answer)</tspan></text><rect x="16" y="308.175" width="388" height="36.2" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="330.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">repeat N rounds → flag</tspan></text><text x="16" y="364.90000000000003" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Always set a timeout and print what you received while</tspan><tspan x="16" dy="16.9">developing.</tspan></text></svg>
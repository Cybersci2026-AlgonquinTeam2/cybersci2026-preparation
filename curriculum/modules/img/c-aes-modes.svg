<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 349" width="420" height="349" role="img" aria-label="AES modes"><title>AES modes</title><rect width="420" height="349" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">AES modes</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">why ECB leaks</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ECB: each 16-byte block encrypted independently</tspan><tspan x="210.0" dy="16.9">same plaintext block → same ciphertext block</tspan></text><rect x="16.0" y="157.25" width="190.0" height="51.8" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="111.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">P1 P2 P1</tspan></text><rect x="214.0" y="157.25" width="190.0" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="309.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">C1 C2 C1</tspan><tspan x="309.0" dy="16.9">(repeat visible)</tspan></text><rect x="16" y="217.0" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="238.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">CBC: each block XORed with the previous ciphertext</tspan><tspan x="210.0" dy="16.9">flip a bit in C(n-1) → flips the same bit in P(n)</tspan></text><text x="16" y="289.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Tell-tale: repeated 16-byte blocks in ciphertext → ECB.</tspan><tspan x="16" dy="16.9">Padding oracle: server says valid/invalid padding →</tspan><tspan x="16" dy="16.9">decrypt byte by byte.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 545" width="420" height="545" role="img" aria-label="Web challenge method"><title>Web challenge method</title><rect width="420" height="545" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Web challenge method</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">map first, exploit second</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">MAP: pages, params, forms, cookies, JS files,</tspan><tspan x="210.0" dy="17.6">robots.txt</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">INPUTS: for each one, what does the server do with</tspan><tspan x="210.0" dy="17.6">it?</tspan></text><line x1="210.0" y1="243.7" x2="210.0" y2="261.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,257.7 L210.0,267.7 L216.0,257.7 z" fill="#64748B"/><rect x="16" y="271.7" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="293.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">TEST classes: SQLi, XSS, LFI/path, command inj,</tspan><tspan x="210.0" dy="17.6">SSTI, IDOR, auth</tspan></text><line x1="210.0" y1="330.8" x2="210.0" y2="348.8" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,344.8 L210.0,354.8 L216.0,344.8 z" fill="#64748B"/><rect x="16" y="358.8" width="388" height="35.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="380.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">EXPLOIT the smallest working proof; then escalate</tspan></text><line x1="210.0" y1="400.35" x2="210.0" y2="418.35" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,414.35 L210.0,424.35 L216.0,414.35 z" fill="#64748B"/><rect x="16" y="428.35" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="450.35" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">CHAIN: low-severity bugs combine (SSRF → internal</tspan><tspan x="210.0" dy="17.6">admin → file read)</tspan></text><text x="16" y="501.95000000000005" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Tools: browser devtools, curl -i, Burp, ffuf, sqlmap</tspan><tspan x="16" dy="16.9">(after manual).</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" role="img" aria-label="SSRF"><title>SSRF</title><rect width="420" height="440" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">SSRF</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">make the server fetch URLs for you</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">You submit url=http://127.0.0.1:8080/admin</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">App server fetches it from INSIDE the network</tspan></text><line x1="210.0" y1="208.60000000000002" x2="210.0" y2="226.60000000000002" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,222.60000000000002 L210.0,232.60000000000002 L216.0,222.60000000000002 z" fill="#64748B"/><rect x="16" y="236.60000000000002" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="258.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Internal service trusts the request (it came from</tspan><tspan x="210.0" dy="17.6">localhost)</tspan></text><line x1="210.0" y1="295.70000000000005" x2="210.0" y2="313.70000000000005" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,309.70000000000005 L210.0,319.70000000000005 L216.0,309.70000000000005 z" fill="#64748B"/><rect x="16" y="323.70000000000005" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="345.70000000000005" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Response is returned to you: admin page, metadata,</tspan><tspan x="210.0" dy="17.6">files</tspan></text><text x="16" y="397.30000000000007" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Targets: 127.0.0.1, 169.254.169.254 (cloud metadata),</tspan><tspan x="16" dy="16.9">internal hostnames, file://</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 385" width="420" height="385" role="img" aria-label="SQL injection"><title>SQL injection</title><rect width="420" height="385" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">SQL injection</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">your input becomes part of the query</tspan></text><rect x="16" y="97.5" width="388" height="54.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">SELECT * FROM users</tspan><tspan x="210.0" dy="18.2">WHERE name = &#x27;&lt;INPUT&gt;&#x27;</tspan></text><line x1="210.0" y1="157.95" x2="210.0" y2="175.95" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,171.95 L210.0,181.95 L216.0,171.95 z" fill="#64748B"/><text x="222.0" y="174.95" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">input:  &#x27; OR 1=1 --</tspan></text><rect x="16" y="185.95" width="388" height="54.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="208.45" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">SELECT * FROM users</tspan><tspan x="210.0" dy="18.2">WHERE name = &#x27;&#x27; OR 1=1 --&#x27;</tspan></text><text x="16" y="260.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">1=1 is always true; -- comments out the rest → all rows</tspan><tspan x="16" dy="16.9">returned.</tspan></text><rect x="16" y="287.775" width="388" height="33.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="308.275" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">UNION: &#x27; UNION SELECT username,password FROM users --</tspan></text><text x="16" y="341.79999999999995" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Steps: find the injection → count columns (ORDER BY n)</tspan><tspan x="16" dy="16.9">→ find text column → read tables (information_schema).</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 377" width="420" height="377" role="img" aria-label="SSH key login"><title>SSH key login</title><rect width="420" height="377" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">SSH key login</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">prove who you are without sending a password</tspan></text><rect x="16.0" y="97.5" width="190.0" height="68.6" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="111.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">YOU hold the PRIVATE key</tspan><tspan x="111.0" dy="16.9">(secret, chmod 600)</tspan></text><rect x="214.0" y="97.5" width="190.0" height="68.6" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="309.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">SERVER holds the PUBLIC</tspan><tspan x="309.0" dy="16.9">key</tspan><tspan x="309.0" dy="16.9">(authorized_keys)</tspan></text><line x1="210.0" y1="172.125" x2="210.0" y2="190.125" stroke="#2563EB" stroke-width="2.2"/><path d="M204.0,186.125 L210.0,196.125 L216.0,186.125 z" fill="#2563EB"/><text x="222.0" y="189.125" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">1. I&#x27;m bandit14</tspan></text><line x1="210.0" y1="198.125" x2="210.0" y2="216.125" stroke="#16A34A" stroke-width="2.2"/><path d="M204.0,212.125 L210.0,222.125 L216.0,212.125 z" fill="#16A34A"/><text x="222.0" y="215.125" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">2. sign this random challenge</tspan></text><line x1="210.0" y1="224.125" x2="210.0" y2="242.125" stroke="#2563EB" stroke-width="2.2"/><path d="M204.0,238.125 L210.0,248.125 L216.0,238.125 z" fill="#2563EB"/><text x="222.0" y="241.125" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">3. here is my signature</tspan></text><rect x="16" y="252.125" width="388" height="36.2" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="274.625" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">server verifies with the public key → you&#x27;re in</tspan></text><rect x="16" y="296.35" width="388" height="34.2" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="317.35" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ssh -i sshkey.private bandit14@localhost -p 2220</tspan></text><text x="16" y="351.05" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">&#x27;UNPROTECTED PRIVATE KEY FILE&#x27; → chmod 600 keyfile</tspan></text></svg>
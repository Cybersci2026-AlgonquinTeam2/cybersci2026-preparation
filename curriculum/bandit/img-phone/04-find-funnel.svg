<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 523" width="420" height="523" role="img" aria-label="find is a funnel"><title>find is a funnel</title><rect width="420" height="523" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">find is a funnel</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">each test throws files away (levels 5-6)</tspan></text><rect x="16.0" y="97.5" width="388" height="55.8" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">find /</tspan></text><text x="210.0" y="137.525" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">every file on disk</tspan></text><rect x="39.0" y="159.25" width="342" height="55.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="181.75" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">-type f</tspan></text><text x="210.0" y="199.275" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">regular files only</tspan></text><rect x="62.0" y="221.0" width="296" height="55.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="243.5" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">-size 33c</tspan></text><text x="210.0" y="261.025" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">exactly 33 bytes</tspan></text><rect x="85.0" y="282.75" width="250" height="55.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="305.25" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">-user bandit7</tspan></text><text x="210.0" y="322.775" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">owned by bandit7</tspan></text><rect x="108.0" y="344.5" width="204" height="55.8" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="367.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">-group bandit6</tspan></text><text x="210.0" y="384.525" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">group is bandit6</tspan></text><rect x="131.0" y="406.25" width="158" height="55.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="428.75" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1 file left</tspan></text><text x="210.0" y="446.275" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">cat it</tspan></text><text x="16" y="480.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Add 2&gt;/dev/null to hide &#x27;Permission denied&#x27; noise</tspan><tspan x="16" dy="16.9">(stderr to the trash).</tspan></text></svg>
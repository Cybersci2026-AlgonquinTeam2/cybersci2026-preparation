<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 527" width="420" height="527" role="img" aria-label="Escape a restricted shell"><title>Escape a restricted shell</title><rect width="420" height="527" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Escape a restricted shell</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">more → vim (level 25)</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1.  ssh as bandit26: login shell is</tspan><tspan x="210.0" dy="17.6">/usr/bin/showtext, not bash</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="53.1" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2.  showtext runs more; text fits → prints and</tspan><tspan x="210.0" dy="17.6">logs you out</tspan></text><line x1="210.0" y1="243.7" x2="210.0" y2="261.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,257.7 L210.0,267.7 L216.0,257.7 z" fill="#64748B"/><rect x="16" y="271.7" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="293.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3.  shrink the terminal window → more PAUSES</tspan></text><line x1="210.0" y1="313.25" x2="210.0" y2="331.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,327.25 L210.0,337.25 L216.0,327.25 z" fill="#64748B"/><rect x="16" y="341.25" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="363.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">4.  press v → more opens vim</tspan></text><line x1="210.0" y1="382.8" x2="210.0" y2="400.8" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,396.8 L210.0,406.8 L216.0,396.8 z" fill="#64748B"/><rect x="16" y="410.8" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="432.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">5.  :set shell=/bin/bash  then  :shell</tspan></text><text x="16" y="466.85" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Or in vim:  :r /etc/bandit_pass/bandit26</tspan><tspan x="16" dy="16.9">Any program that can launch another program (more,</tspan><tspan x="16" dy="16.9">less, vim, man, find, git…) is an exit.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 423" width="420" height="423" role="img" aria-label="The uppercase shell"><title>The uppercase shell</title><rect width="420" height="423" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">The uppercase shell</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">level 32</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">you type:  ls</tspan></text><line x1="210.0" y1="139.725" x2="210.0" y2="157.725" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.725 L210.0,163.725 L216.0,153.725 z" fill="#64748B"/><text x="222.0" y="156.725" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">shell uppercases</tspan></text><rect x="16" y="167.725" width="388" height="36.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="190.225" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">LS: command not found</tspan></text><rect x="16" y="221.95" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="244.45" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">you type:  $0</tspan></text><line x1="210.0" y1="264.175" x2="210.0" y2="282.175" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,278.175 L210.0,288.175 L216.0,278.175 z" fill="#64748B"/><text x="222.0" y="281.175" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">$ and digits have no case</tspan></text><rect x="16" y="292.175" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="314.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">$0 expands to the shell&#x27;s name (sh)</tspan></text><line x1="210.0" y1="334.40000000000003" x2="210.0" y2="352.40000000000003" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,348.40000000000003 L210.0,358.40000000000003 L216.0,348.40000000000003 z" fill="#64748B"/><rect x="16" y="362.40000000000003" width="388" height="36.2" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="384.90000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">a normal sh starts: lowercase works again</tspan></text></svg>
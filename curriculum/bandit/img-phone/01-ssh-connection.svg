<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 388" width="420" height="388" role="img" aria-label="How you reach Bandit"><title>How you reach Bandit</title><rect width="420" height="388" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">How you reach Bandit</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">SSH on port 2220</tspan></text><rect x="16" y="97.5" width="388" height="54.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Your PC</tspan><tspan x="210.0" dy="18.2">Windows Terminal</tspan></text><line x1="210.0" y1="157.95" x2="210.0" y2="175.95" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,171.95 L210.0,181.95 L216.0,171.95 z" fill="#64748B"/><text x="222.0" y="174.95" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">ssh bandit0@bandit.labs</tspan><tspan x="222.0" dy="16.2">.overthewire.org -p 2220</tspan></text><rect x="16" y="199.95" width="388" height="54.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="222.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">bandit server</tspan><tspan x="210.0" dy="18.2">sshd listening on 2220</tspan></text><line x1="210.0" y1="260.4" x2="210.0" y2="278.4" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,274.4 L210.0,284.4 L216.0,274.4 z" fill="#64748B"/><text x="222.0" y="277.4" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">encrypted shell</tspan></text><rect x="16" y="288.4" width="388" height="36.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="310.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">You land in /home/banditN as that user</tspan></text><text x="16" y="345.125" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Password for level N = what you found in level N-1.</tspan><tspan x="16" dy="16.9">Level 0 password: bandit0</tspan></text></svg>
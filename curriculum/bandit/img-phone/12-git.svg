<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 497" width="420" height="497" role="img" aria-label="Git in one picture"><title>Git in one picture</title><rect width="420" height="497" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Git in one picture</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">levels 27-31</tspan></text><rect x="16.0" y="97.5" width="190.0" height="34.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="111.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">working folder</tspan></text><rect x="214.0" y="97.5" width="190.0" height="34.9" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="309.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">staging</tspan></text><line x1="210.0" y1="138.375" x2="210.0" y2="156.375" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,152.375 L210.0,162.375 L216.0,152.375 z" fill="#64748B"/><text x="222.0" y="155.375" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">git add</tspan></text><rect x="16.0" y="166.375" width="190.0" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="111.0" y="187.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">local repo</tspan></text><rect x="214.0" y="166.375" width="190.0" height="34.9" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="309.0" y="187.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">remote origin</tspan></text><line x1="210.0" y1="207.25" x2="210.0" y2="225.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,221.25 L210.0,231.25 L216.0,221.25 z" fill="#64748B"/><text x="222.0" y="224.25" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">git commit → git push</tspan></text><rect x="16" y="239.25" width="388" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="260.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">History = chain of commits</tspan><tspan x="210.0" dy="16.9">c1 ← c2 ← c3 (SECRET added) ← c4 (removed) ← c5 HEAD</tspan></text><text x="16" y="311.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Level 28: removed in the newest commit, still in c3 →</tspan><tspan x="16" dy="16.9">git log -p</tspan></text><rect x="16" y="338.375" width="388" height="34.9" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="359.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">master / dev  = branches (level 29: git branch -a)</tspan></text><rect x="16" y="381.25" width="388" height="34.9" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="402.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">secret  = a tag (level 30: git tag, git show secret)</tspan></text><rect x="16" y="424.125" width="388" height="49.0" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="444.625" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">level 31: git add -f key.txt → commit → git push</tspan><tspan x="210.0" dy="15.5">origin master</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 426" width="420" height="426" role="img" aria-label="Brute force a 4-digit PIN"><title>Brute force a 4-digit PIN</title><rect width="420" height="426" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Brute force a 4-digit PIN</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">10,000 tries, one pipe (level 24)</tspan></text><rect x="16" y="97.5" width="388" height="54.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">for i in {0000..9999}</tspan><tspan x="210.0" dy="18.2">  echo &quot;PASS $i&quot;</tspan></text><line x1="210.0" y1="157.95" x2="210.0" y2="175.95" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,171.95 L210.0,181.95 L216.0,171.95 z" fill="#64748B"/><text x="222.0" y="174.95" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">one long stream, 10,000 lines</tspan></text><rect x="16" y="185.95" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="208.45" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">nc localhost 30002</tspan></text><line x1="210.0" y1="228.17499999999998" x2="210.0" y2="246.17499999999998" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,242.17499999999998 L210.0,252.17499999999998 L216.0,242.17499999999998 z" fill="#64748B"/><rect x="16" y="256.17499999999995" width="388" height="36.2" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="278.67499999999995" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">daemon on :30002 replies line by line</tspan></text><line x1="210.0" y1="298.4" x2="210.0" y2="316.4" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,312.4 L210.0,322.4 L216.0,312.4 z" fill="#64748B"/><text x="222.0" y="315.4" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">| grep -v Wrong</tspan></text><rect x="16" y="326.4" width="388" height="36.2" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="348.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">the one reply that is not &#x27;Wrong!&#x27;</tspan></text><text x="16" y="383.125" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Zero padding matters: 0007, not 7.  Real systems add</tspan><tspan x="16" dy="16.9">lockouts and rate limits.</tspan></text></svg>
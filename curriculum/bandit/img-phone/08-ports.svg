<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 464" width="420" height="464" role="img" aria-label="Ports: one machine, many doors"><title>Ports: one machine, many doors</title><rect width="420" height="464" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Ports: one machine, many doors</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">levels 14-16</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">localhost  (the server you are on)</tspan></text><line x1="210.0" y1="139.725" x2="210.0" y2="157.725" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.725 L210.0,163.725 L216.0,153.725 z" fill="#64748B"/><rect x="16" y="167.725" width="388" height="55.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="190.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">30000  plain TCP</tspan></text><text x="210.0" y="207.75" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">nc localhost 30000</tspan></text><rect x="16" y="231.475" width="388" height="55.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="253.975" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">30001  TLS / SSL</tspan></text><text x="210.0" y="271.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">openssl s_client -quiet -connect localhost:30001</tspan></text><rect x="16" y="295.225" width="388" height="71.3" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="317.725" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">31000-32000  1000 ports</tspan></text><text x="210.0" y="335.25" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">most closed, some echo, ONE speaks TLS and returns a</tspan><tspan x="210.0" dy="15.5">key.  nmap -p 31000-32000 localhost</tspan></text><text x="16" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Plain TCP: text goes as-is.  TLS: encrypted first, nc</tspan><tspan x="16" dy="16.9">can&#x27;t talk to it.</tspan><tspan x="16" dy="16.9">If s_client prints RENEGOTIATING / KEYUPDATE, add</tspan><tspan x="16" dy="16.9">-quiet.</tspan></text></svg>
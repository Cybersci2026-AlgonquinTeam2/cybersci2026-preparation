<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 405" width="420" height="405" role="img" aria-label="cron: scheduled robot"><title>cron: scheduled robot</title><rect width="420" height="405" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">cron: scheduled robot</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">levels 21-23</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">/etc/cron.d/cronjob_banditN</tspan><tspan x="210.0" dy="16.9">* * * * *  banditN  script.sh</tspan></text><line x1="210.0" y1="155.25" x2="210.0" y2="173.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,169.25 L210.0,179.25 L216.0,169.25 z" fill="#64748B"/><text x="222.0" y="172.25" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">every minute</tspan></text><rect x="16" y="183.25" width="388" height="54.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="205.75" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">script.sh runs AS banditN</tspan><tspan x="210.0" dy="18.2">writes the password to /tmp/&lt;name&gt;</tspan></text><line x1="210.0" y1="243.7" x2="210.0" y2="261.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,257.7 L210.0,267.7 L216.0,257.7 z" fill="#64748B"/><rect x="16" y="271.7" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="294.2" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">YOU: cat /tmp/&lt;name&gt;</tspan></text><text x="16" y="328.425" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Method: ls /etc/cron.d → cat the job → cat the script →</tspan><tspan x="16" dy="16.9">work out the output file → cat it.</tspan><tspan x="16" dy="16.9">Level 23 flips it: YOU write the script, cron (as</tspan><tspan x="16" dy="16.9">bandit24) runs it.</tspan></text></svg>
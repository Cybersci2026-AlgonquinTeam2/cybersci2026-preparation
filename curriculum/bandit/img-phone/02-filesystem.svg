<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 526" width="420" height="526" role="img" aria-label="The Linux file system"><title>The Linux file system</title><rect width="420" height="526" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">The Linux file system</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">where Bandit hides things</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">/   (root)</tspan></text><rect x="16" y="141.725" width="388" height="54.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="164.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">/home/banditN  =  ~</tspan><tspan x="210.0" dy="18.2">your starting folder</tspan></text><rect x="16" y="204.175" width="388" height="54.5" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="226.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">/etc/bandit_pass/</tspan><tspan x="210.0" dy="18.2">one file per user; only that user can read it</tspan></text><rect x="16" y="266.625" width="388" height="54.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="289.125" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">/tmp</tspan><tspan x="210.0" dy="18.2">anyone can write: your scratch space</tspan></text><rect x="16" y="329.075" width="388" height="54.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="351.575" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">/var/spool, /var/log</tspan><tspan x="210.0" dy="18.2">queues and logs</tspan></text><rect x="16" y="391.525" width="388" height="54.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="414.025" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">/usr/bin</tspan><tspan x="210.0" dy="18.2">programs and scripts (cron jobs live here)</tspan></text><text x="16" y="466.47499999999997" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">.  = this folder      ..  = parent folder</tspan><tspan x="16" dy="16.9">~  = your home        /  = the root</tspan><tspan x="16" dy="16.9">starts with /  =  absolute path</tspan></text></svg>
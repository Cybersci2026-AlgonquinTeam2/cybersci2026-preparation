<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 475" width="420" height="475" role="img" aria-label="Decoding onions"><title>Decoding onions</title><rect width="420" height="475" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Decoding onions</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">peel one layer at a time (levels 10-12)</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Level 12 loop:  file → pick tool → peel → file …</tspan></text><rect x="16.0" y="141.725" width="190.0" height="51.8" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="111.0" y="163.225" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">hex dump</tspan><tspan x="111.0" dy="16.9">xxd -r</tspan></text><rect x="214.0" y="141.725" width="190.0" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="309.0" y="163.225" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">gzip</tspan><tspan x="309.0" dy="16.9">gzip -d</tspan></text><rect x="16.0" y="201.475" width="190.0" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="111.0" y="222.975" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="111.0" dy="0">bzip2</tspan><tspan x="111.0" dy="16.9">bzip2 -d</tspan></text><rect x="214.0" y="201.475" width="190.0" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="309.0" y="222.975" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="309.0" dy="0">tar</tspan><tspan x="309.0" dy="16.9">tar xf</tspan></text><rect x="16" y="261.225" width="388" height="36.2" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="283.725" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">until file says ASCII text → cat it</tspan></text><rect x="16" y="311.45000000000005" width="388" height="54.5" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="333.95000000000005" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Level 11: ROT13 shifts letters by 13</tspan><tspan x="210.0" dy="18.2">A→N  B→O  C→P … M→Z  (twice = original)</tspan></text><rect x="16" y="373.90000000000003" width="388" height="34.2" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="394.90000000000003" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">tr &#x27;A-Za-z&#x27; &#x27;N-ZA-Mn-za-m&#x27; &lt; data.txt</tspan></text><rect x="16" y="416.1" width="388" height="34.9" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="437.6" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Level 10: base64 -d data.txt</tspan></text></svg>
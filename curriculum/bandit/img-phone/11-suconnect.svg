<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 503" width="420" height="503" role="img" aria-label="Be the server (level 20)"><title>Be the server (level 20)</title><rect width="420" height="503" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Be the server (level 20)</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">two terminals</tspan></text><rect x="16" y="97.5" width="388" height="54.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Terminal 1</tspan><tspan x="210.0" dy="18.2">nc -l -p 4444   (listen)</tspan></text><rect x="16" y="159.95" width="388" height="54.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="182.45" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Terminal 2</tspan><tspan x="210.0" dy="18.2">./suconnect 4444</tspan></text><rect x="16" y="222.39999999999998" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="244.39999999999998" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1.  T1 starts listening on port 4444</tspan></text><rect x="16" y="265.95" width="388" height="35.5" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="287.95" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2.  T2 runs suconnect: it dials localhost:4444</tspan></text><rect x="16" y="309.5" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="331.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3.  you send bandit20&#x27;s password through T1</tspan></text><rect x="16" y="353.05" width="388" height="53.1" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="375.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">4.  suconnect checks it; if right, SENDS the next</tspan><tspan x="210.0" dy="17.6">password back</tspan></text><text x="16" y="426.65000000000003" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">One-shell version:</tspan><tspan x="16" dy="16.9">echo &quot;$(cat /etc/bandit_pass/bandit20)&quot; | nc -l -p</tspan><tspan x="16" dy="16.9">4444 &amp;</tspan><tspan x="16" dy="16.9">./suconnect 4444</tspan></text></svg>
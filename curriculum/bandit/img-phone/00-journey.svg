<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 688" width="420" height="688" role="img" aria-label="Bandit journey map"><title>Bandit journey map</title><rect width="420" height="688" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Bandit journey map</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">34 levels in 13 skill clusters</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 0-4:  Basics: ssh, cat, odd filenames</tspan></text><rect x="16" y="141.725" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="164.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 5-6:  find: filter by properties</tspan></text><rect x="16" y="185.95" width="388" height="36.2" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="208.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 7-9:  grep, sort, uniq, strings</tspan></text><rect x="16" y="230.17499999999998" width="388" height="36.2" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="252.67499999999998" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 10-12:  base64, ROT13, hex + compression</tspan></text><rect x="16" y="274.4" width="388" height="36.2" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="296.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 13:  SSH keys</tspan></text><rect x="16" y="318.625" width="388" height="36.2" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="341.125" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 14-16:  nc, TLS, nmap</tspan></text><rect x="16" y="362.85" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="385.35" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 17-19:  diff, remote commands, setuid</tspan></text><rect x="16" y="407.07500000000005" width="388" height="36.2" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="429.57500000000005" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 20:  sockets: be the server</tspan></text><rect x="16" y="451.30000000000007" width="388" height="36.2" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="473.80000000000007" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 21-23:  cron jobs</tspan></text><rect x="16" y="495.5250000000001" width="388" height="36.2" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="518.0250000000001" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 24:  brute force a PIN</tspan></text><rect x="16" y="539.7500000000001" width="388" height="36.2" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="562.2500000000001" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 25-26:  restricted shell, vim escape</tspan></text><rect x="16" y="583.9750000000001" width="388" height="36.2" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="606.4750000000001" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 27-31:  git: log, branch, tag, push</tspan></text><rect x="16" y="628.2000000000002" width="388" height="36.2" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="650.7000000000002" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Levels 32-33:  uppercase shell, finish</tspan></text></svg>
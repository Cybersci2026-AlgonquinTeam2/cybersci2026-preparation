<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 409" width="420" height="409" role="img" aria-label="setuid: borrow the owner&#x27;s identity"><title>setuid: borrow the owner&#x27;s identity</title><rect width="420" height="409" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">setuid: borrow the owner&#x27;s identity</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">levels 19 and 26</tspan></text><rect x="16" y="97.5" width="388" height="90.9" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Normal program</tspan><tspan x="210.0" dy="18.2">you (bandit19) run cat</tspan><tspan x="210.0" dy="18.2">→ runs AS bandit19</tspan><tspan x="210.0" dy="18.2">→ /etc/bandit_pass/bandit20: DENIED</tspan></text><rect x="16" y="196.4" width="388" height="90.9" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="218.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">setuid program  -rwsr-x---</tspan><tspan x="210.0" dy="18.2">./bandit20-do cat …</tspan><tspan x="210.0" dy="18.2">→ runs AS bandit20 (owner)</tspan><tspan x="210.0" dy="18.2">→ file readable: ALLOWED</tspan></text><rect x="16" y="295.3" width="388" height="50.4" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8"/><text x="210.0" y="316.3" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ls -l shows the s:</tspan><tspan x="210.0" dy="16.2">-rwsr-x---  bandit20 bandit19  bandit20-do</tspan></text><text x="16" y="366.20000000000005" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Find all setuid files:  find / -perm -4000 2&gt;/dev/null</tspan><tspan x="16" dy="16.9">They are prime privilege-escalation targets (GTFOBins).</tspan></text></svg>
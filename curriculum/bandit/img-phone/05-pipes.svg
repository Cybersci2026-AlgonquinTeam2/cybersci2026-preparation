<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 478" width="420" height="478" role="img" aria-label="Pipes"><title>Pipes</title><rect width="420" height="478" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Pipes</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">each command&#x27;s output feeds the next (levels 7-9)</tspan></text><rect x="16" y="97.5" width="388" height="36.2" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="120.0" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">cat data.txt</tspan></text><line x1="210.0" y1="139.725" x2="210.0" y2="157.725" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.725 L210.0,163.725 L216.0,153.725 z" fill="#64748B"/><text x="222.0" y="156.725" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">|</tspan></text><rect x="16" y="167.725" width="388" height="54.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="190.225" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">sort</tspan><tspan x="210.0" dy="18.2">groups equal lines together</tspan></text><line x1="210.0" y1="228.175" x2="210.0" y2="246.175" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,242.175 L210.0,252.175 L216.0,242.175 z" fill="#64748B"/><text x="222.0" y="245.175" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="222.0" dy="0">|</tspan></text><rect x="16" y="256.175" width="388" height="54.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="278.675" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">uniq -u</tspan><tspan x="210.0" dy="18.2">keeps lines that occur ONCE</tspan></text><line x1="210.0" y1="316.625" x2="210.0" y2="334.625" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,330.625 L210.0,340.625 L216.0,330.625 z" fill="#64748B"/><rect x="16" y="344.625" width="388" height="36.2" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="367.125" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">the answer</tspan></text><text x="16" y="401.35" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">uniq only compares NEIGHBOURING lines, so sort first.</tspan><tspan x="16" dy="16.9">grep PATTERN file: keep matching lines.</tspan><tspan x="16" dy="16.9">strings file | grep &#x27;==&#x27;: readable text out of binary</tspan><tspan x="16" dy="16.9">junk.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" role="img" aria-label="Pipes: each command&#x27;s output feeds the next (levels 7-9)"><title>Pipes: each command&#x27;s output feeds the next (levels 7-9)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="300" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Pipes: each command&#x27;s output feeds the next (levels 7-9)</text><rect x="20" y="70" width="130" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="85.0" y="102.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="85.0" dy="0">cat data.txt</tspan></text><rect x="210" y="70" width="130" height="56" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="275.0" y="102.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="275.0" dy="0">sort</tspan></text><rect x="400" y="70" width="150" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="475.0" y="102.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="475.0" dy="0">uniq -u</tspan></text><rect x="610" y="70" width="130" height="56" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="675.0" y="102.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="675.0" dy="0">answer</tspan></text><line x1="150" y1="98" x2="210" y2="98" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="180" y="88" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="180" dy="0">|</tspan></text><line x1="340" y1="98" x2="400" y2="98" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="370" y="88" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="370" dy="0">|</tspan></text><line x1="550" y1="98" x2="610" y2="98" stroke="#DC2626" stroke-width="2" marker-end="url(#ared)"/><rect x="210" y="150" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="275.0" y="160.25" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="275.0" dy="0">a</tspan><tspan x="275.0" dy="14.3">b</tspan><tspan x="275.0" dy="14.3">a</tspan><tspan x="275.0" dy="14.3">c  &lt;- sorted:</tspan><tspan x="275.0" dy="14.3">a a b c</tspan></text><rect x="400" y="150" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="475.0" y="174.54999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="475.0" dy="0">keeps only lines</tspan><tspan x="475.0" dy="14.3">that appear ONCE</tspan><tspan x="475.0" dy="14.3">=&gt; b and c</tspan></text><text x="20" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">uniq only compares NEIGHBOURING lines, so sort first.   grep PATTERN file: keep matching lines.</tspan></text><text x="20" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">strings file | grep &#x27;==&#x27;:  pull readable text out of binary junk, then filter.</tspan></text></svg>
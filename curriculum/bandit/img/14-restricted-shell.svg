<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" role="img" aria-label="Escaping a restricted shell via more → vim (level 25)"><title>Escaping a restricted shell via more → vim (level 25)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="380" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Escaping a restricted shell via more → vim (level 25)</text><rect x="20" y="70" width="134" height="40" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="87.0" y="93.85" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="87.0" dy="0">ssh as bandit26</tspan></text><rect x="20" y="120" width="134" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="87.0" y="144.54999999999998" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="87.0" dy="0">login shell is</tspan><tspan x="87.0" dy="14.3">/usr/bin/showtext,</tspan><tspan x="87.0" dy="14.3">not bash</tspan></text><line x1="154" y1="90" x2="166" y2="90" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="166" y="70" width="134" height="40" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="233.0" y="93.85" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="233.0" dy="0">showtext runs more</tspan></text><rect x="166" y="120" width="134" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="233.0" y="151.7" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="233.0" dy="0">text fits → prints</tspan><tspan x="233.0" dy="14.3">and exits (logged out)</tspan></text><line x1="300" y1="90" x2="312" y2="90" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="312" y="70" width="134" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="379.0" y="93.85" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="379.0" dy="0">shrink the terminal</tspan></text><rect x="312" y="120" width="134" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="379.0" y="151.7" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="379.0" dy="0">text no longer fits</tspan><tspan x="379.0" dy="14.3">→ more PAUSES</tspan></text><line x1="446" y1="90" x2="458" y2="90" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="458" y="70" width="134" height="40" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="525.0" y="93.85" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="525.0" dy="0">press v</tspan></text><rect x="458" y="120" width="134" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="525.0" y="151.7" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="525.0" dy="0">more launches</tspan><tspan x="525.0" dy="14.3">vim to edit</tspan></text><line x1="592" y1="90" x2="604" y2="90" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="604" y="70" width="134" height="40" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="671.0" y="93.85" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="671.0" dy="0">inside vim</tspan></text><rect x="604" y="120" width="134" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="671.0" y="151.7" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="671.0" dy="0">:set shell=/bin/bash</tspan><tspan x="671.0" dy="14.3">:shell</tspan></text><rect x="20" y="225" width="720" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="251.39999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">Then you have a real shell: read the password, or use ./bandit27-do (setuid) for the next level.</tspan><tspan x="380.0" dy="15.600000000000001">In vim you can also read a file directly:  :r /etc/bandit_pass/bandit26</tspan></text><text x="20" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">Idea to remember: any program that can launch another program (more, less, vim, git, find …)</tspan></text><text x="20" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">can break out of a restricted environment. GTFOBins catalogues them.</tspan></text></svg>
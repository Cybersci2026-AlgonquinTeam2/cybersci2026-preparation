<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" role="img" aria-label="Git in one picture (levels 27-31)"><title>Git in one picture (levels 27-31)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="440" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Git in one picture (levels 27-31)</text><rect x="30" y="60" width="150" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="105.0" y="84.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="105.0" dy="0">working folder</tspan><tspan x="105.0" dy="15.600000000000001">(files you edit)</tspan></text><rect x="240" y="60" width="130" height="56" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="305.0" y="84.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="305.0" dy="0">staging area</tspan><tspan x="305.0" dy="15.600000000000001">(git add)</tspan></text><rect x="430" y="60" width="140" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="500.0" y="84.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="500.0" dy="0">local repo</tspan><tspan x="500.0" dy="15.600000000000001">(git commit)</tspan></text><rect x="620" y="60" width="120" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="680.0" y="84.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="680.0" dy="0">remote origin</tspan><tspan x="680.0" dy="15.600000000000001">(git push)</tspan></text><line x1="180" y1="88" x2="240" y2="88" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="210.0" y="78" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="210.0" dy="0">add</tspan></text><line x1="370" y1="88" x2="430" y2="88" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="400.0" y="78" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="400.0" dy="0">commit</tspan></text><line x1="570" y1="88" x2="620" y2="88" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="595.0" y="78" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="595.0" dy="0">push</tspan></text><text x="30" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="30" dy="0">history = a chain of commits (newest on the right). A branch is a movable label; a tag is a fixed label.</tspan></text><rect x="40" y="190" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="85.0" y="217.7" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="85.0" dy="0">c1</tspan><tspan x="85.0" dy="14.3">init</tspan></text><rect x="160" y="190" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="205.0" y="217.7" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="205.0" dy="0">c2</tspan><tspan x="205.0" dy="14.3">add note</tspan></text><line x1="130" y1="221" x2="160" y2="221" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="280" y="190" width="90" height="62" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="325.0" y="210.54999999999998" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="325.0" dy="0">c3</tspan><tspan x="325.0" dy="14.3">SECRET</tspan><tspan x="325.0" dy="14.3">added</tspan></text><line x1="250" y1="221" x2="280" y2="221" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="400" y="190" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="445.0" y="210.54999999999998" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="445.0" dy="0">c4</tspan><tspan x="445.0" dy="14.3">secret</tspan><tspan x="445.0" dy="14.3">removed</tspan></text><line x1="370" y1="221" x2="400" y2="221" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="520" y="190" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="565.0" y="217.7" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="565.0" dy="0">c5</tspan><tspan x="565.0" dy="14.3">HEAD</tspan></text><line x1="490" y1="221" x2="520" y2="221" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="30" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="30" dy="0">Level 28: the password was removed in the newest commit but it still lives in c3 → git log, git show &lt;hash&gt;</tspan></text><rect x="40" y="310" width="200" height="40" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="140.0" y="334.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="140.0" dy="0">master (branch)</tspan></text><rect x="280" y="310" width="200" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="380.0" y="334.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">dev (branch, level 29)</tspan></text><rect x="520" y="310" width="200" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="620.0" y="334.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="620.0" dy="0">secret (tag, level 30)</tspan></text><rect x="30" y="370" width="700" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="392.70000000000005" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">git clone URL  ·  git log -p  ·  git show HASH  ·  git branch -a  ·  git checkout dev  ·  git tag  ·  git show TAG</tspan><tspan x="380.0" dy="14.3">level 31: git add -f key.txt  (.gitignore blocks *.txt)  →  git commit  →  git push origin master</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" role="img" aria-label="Brute force a 4-digit PIN: 10,000 tries, one pipe (level 24)"><title>Brute force a 4-digit PIN: 10,000 tries, one pipe (level 24)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="300" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Brute force a 4-digit PIN: 10,000 tries, one pipe (level 24)</text><rect x="20" y="70" width="190" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="115.0" y="101.69999999999999" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="115.0" dy="0">for i in {0000..9999}</tspan><tspan x="115.0" dy="14.3">  echo &quot;PASS $i&quot;</tspan></text><rect x="280" y="70" width="140" height="70" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="350.0" y="93.60000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="350.0" dy="0">one long</tspan><tspan x="350.0" dy="15.600000000000001">stream of</tspan><tspan x="350.0" dy="15.600000000000001">10,000 lines</tspan></text><rect x="490" y="70" width="130" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="555.0" y="101.4" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="555.0" dy="0">nc localhost</tspan><tspan x="555.0" dy="15.600000000000001">30002</tspan></text><rect x="660" y="70" width="90" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="705.0" y="101.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="705.0" dy="0">daemon</tspan><tspan x="705.0" dy="15.600000000000001">:30002</tspan></text><line x1="210" y1="105" x2="280" y2="105" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="420" y1="105" x2="490" y2="105" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="620" y1="105" x2="660" y2="105" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="20" y="175" width="720" height="48" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="203.55" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">| grep -v Wrong      keeps only the one reply that is not &#x27;Wrong!&#x27;</tspan></text><text x="20" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">Why it works: the PIN space is tiny (10^4). Real systems add lockouts, delays and rate limits.</tspan></text><text x="20" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">Zero-padding matters: 0007, not 7.  Brace expansion {0000..9999} keeps the width in bash.</tspan></text></svg>
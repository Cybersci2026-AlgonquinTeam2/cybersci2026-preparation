<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" role="img" aria-label="Two terminals: be the server for suconnect (level 20)"><title>Two terminals: be the server for suconnect (level 20)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Two terminals: be the server for suconnect (level 20)</text><rect x="30" y="60" width="300" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="180.0" y="91.4" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="180.0" dy="0">Terminal 1 (you)</tspan><tspan x="180.0" dy="15.600000000000001">nc -l -p 4444   (listen)</tspan></text><rect x="430" y="60" width="300" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="580.0" y="91.4" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="580.0" dy="0">Terminal 2 (you)</tspan><tspan x="580.0" dy="15.600000000000001">./suconnect 4444</tspan></text><text x="40" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="40" dy="0">sequence</tspan></text><rect x="30" y="185" width="30" height="30" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="45.0" y="204.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="45.0" dy="0">1</tspan></text><text x="75" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start"><tspan x="75" dy="0">T1 starts listening on port 4444</tspan></text><rect x="30" y="225" width="30" height="30" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="45.0" y="244.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="45.0" dy="0">2</tspan></text><text x="75" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start"><tspan x="75" dy="0">T2 runs suconnect, which dials localhost:4444</tspan></text><rect x="30" y="265" width="30" height="30" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="45.0" y="284.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="45.0" dy="0">3</tspan></text><text x="75" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start"><tspan x="75" dy="0">you type bandit20&#x27;s password into T1 (nc sends it)</tspan></text><rect x="30" y="305" width="30" height="30" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="45.0" y="324.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="45.0" dy="0">4</tspan></text><text x="75" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start"><tspan x="75" dy="0">suconnect checks it; if right, SENDS the next password back</tspan></text><text x="30" y="355" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="30" dy="0">One shell variant: echo &quot;$(cat /etc/bandit_pass/bandit20)&quot; | nc -l -p 4444 &amp;   then   ./suconnect 4444</tspan></text></svg>
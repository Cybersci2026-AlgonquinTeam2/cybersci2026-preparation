<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" role="img" aria-label="SSH key login: prove who you are without sending a password (level 13, 16)"><title>SSH key login: prove who you are without sending a password (level 13, 16)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="330" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">SSH key login: prove who you are without sending a password (level 13, 16)</text><rect x="30" y="60" width="220" height="100" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="140.0" y="96.7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="140.0" dy="0">YOU hold the</tspan><tspan x="140.0" dy="18.2">PRIVATE key</tspan><tspan x="140.0" dy="18.2">(secret; chmod 600)</tspan></text><rect x="510" y="60" width="220" height="100" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="620.0" y="96.7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="620.0" dy="0">SERVER holds the</tspan><tspan x="620.0" dy="18.2">PUBLIC key</tspan><tspan x="620.0" dy="18.2">(authorized_keys)</tspan></text><line x1="250" y1="90" x2="510" y2="90" stroke="#2563EB" stroke-width="2" marker-end="url(#ablue)"/><text x="380.0" y="80" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="380.0" dy="0">1. I&#x27;m bandit14</tspan></text><line x1="510" y1="110" x2="250" y2="110" stroke="#16A34A" stroke-width="2" marker-end="url(#agreen)"/><text x="380.0" y="130" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="380.0" dy="0">2. sign this random challenge</tspan></text><line x1="250" y1="140" x2="510" y2="140" stroke="#2563EB" stroke-width="2" marker-end="url(#ablue)"/><text x="380.0" y="158" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="380.0" dy="0">3. signature</tspan></text><rect x="250" y="185" width="260" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="380.0" y="214.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">server verifies with public key → in</tspan></text><rect x="30" y="255" width="700" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="278.4" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">ssh -i sshkey.private bandit14@localhost -p 2220</tspan><tspan x="380.0" dy="15.600000000000001">If ssh says &#x27;UNPROTECTED PRIVATE KEY FILE&#x27;: chmod 600 keyfile</tspan></text></svg>
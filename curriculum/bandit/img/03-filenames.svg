<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" role="img" aria-label="Filenames that fight the shell (levels 1-4)"><title>Filenames that fight the shell (levels 1-4)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="330" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Filenames that fight the shell (levels 1-4)</text><rect x="30" y="45" width="200" height="32" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="130.0" y="65.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="130.0" dy="0">file you see</tspan></text><rect x="250" y="45" width="260" height="32" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="380.0" y="65.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">what the shell does</tspan></text><rect x="530" y="45" width="200" height="32" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="630.0" y="65.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="630.0" dy="0">fix</tspan></text><rect x="30" y="90" width="200" height="42" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="130.0" y="115.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="130.0" dy="0">-</tspan></text><rect x="250" y="90" width="260" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="115.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">treats it as stdin / an option</tspan></text><rect x="530" y="90" width="200" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="630.0" y="114.85" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="630.0" dy="0">cat ./-</tspan></text><line x1="230" y1="111" x2="250" y2="111" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="510" y1="111" x2="530" y2="111" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="30" y="145" width="200" height="42" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="130.0" y="170.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="130.0" dy="0">spaces in this filename</tspan></text><rect x="250" y="145" width="260" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="170.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">splits into 4 separate arguments</tspan></text><rect x="530" y="145" width="200" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="630.0" y="169.85" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="630.0" dy="0">cat &quot;spaces in this filename&quot;</tspan></text><line x1="230" y1="166" x2="250" y2="166" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="510" y1="166" x2="530" y2="166" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="30" y="200" width="200" height="42" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="130.0" y="225.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="130.0" dy="0">.hidden</tspan></text><rect x="250" y="200" width="260" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="225.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">ls skips names starting with .</tspan></text><rect x="530" y="200" width="200" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="630.0" y="224.85" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="630.0" dy="0">ls -a   then   cat ./.hidden</tspan></text><line x1="230" y1="221" x2="250" y2="221" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="510" y1="221" x2="530" y2="221" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="30" y="255" width="200" height="42" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="130.0" y="280.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="130.0" dy="0">-file07</tspan></text><rect x="250" y="255" width="260" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="280.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">starts with - so looks like a flag</tspan></text><rect x="530" y="255" width="200" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="630.0" y="279.85" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="630.0" dy="0">cat ./-file07</tspan></text><line x1="230" y1="276" x2="250" y2="276" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="510" y1="276" x2="530" y2="276" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="30" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="30" dy="0">Rule of thumb: when a name looks odd, give it a path (./name) or quote it.</tspan></text></svg>
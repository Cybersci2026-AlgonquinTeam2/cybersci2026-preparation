<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" role="img" aria-label="The Linux file system: where Bandit hides things"><title>The Linux file system: where Bandit hides things</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="400" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">The Linux file system: where Bandit hides things</text><rect x="330" y="50" width="100" height="38" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="380.0" y="73.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">/</tspan></text><line x1="380" y1="88" x2="85" y2="135" stroke="#64748B" stroke-width="1.6"/><rect x="40" y="135" width="90" height="38" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="85.0" y="158.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="85.0" dy="0">home</tspan></text><text x="85" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="85" dy="0">/home/bandit0 = ~</tspan><tspan x="85" dy="14.3">your starting folder</tspan></text><line x1="380" y1="88" x2="245" y2="135" stroke="#64748B" stroke-width="1.6"/><rect x="200" y="135" width="90" height="38" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="245.0" y="158.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="245.0" dy="0">etc</tspan></text><text x="245" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="245" dy="0">/etc/bandit_pass/</tspan><tspan x="245" dy="14.3">one file per user:</tspan><tspan x="245" dy="14.3">only that user may read</tspan></text><line x1="380" y1="88" x2="405" y2="135" stroke="#64748B" stroke-width="1.6"/><rect x="360" y="135" width="90" height="38" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="405.0" y="158.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="405.0" dy="0">tmp</tspan></text><text x="405" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="405" dy="0">/tmp</tspan><tspan x="405" dy="14.3">anyone can write:</tspan><tspan x="405" dy="14.3">your scratch space</tspan></text><line x1="380" y1="88" x2="565" y2="135" stroke="#64748B" stroke-width="1.6"/><rect x="520" y="135" width="90" height="38" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="565.0" y="158.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="565.0" dy="0">var</tspan></text><text x="565" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="565" dy="0">/var/spool, /var/log</tspan><tspan x="565" dy="14.3">queues + logs</tspan></text><line x1="380" y1="88" x2="695" y2="135" stroke="#64748B" stroke-width="1.6"/><rect x="650" y="135" width="90" height="38" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><text x="695.0" y="158.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="695.0" dy="0">usr</tspan></text><text x="695" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="695" dy="0">/usr/bin</tspan><tspan x="695" dy="14.3">programs; scripts</tspan><tspan x="695" dy="14.3">(cron jobs live here)</tspan></text><rect x="40" y="290" width="330" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="205.0" y="318.59999999999997" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="205.0" dy="0">.  = this folder    ..  = parent folder</tspan><tspan x="205.0" dy="15.600000000000001">~  = your home      /  = the root</tspan><tspan x="205.0" dy="15.600000000000001">starts with /  =  absolute path</tspan></text><rect x="400" y="290" width="330" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="565.0" y="318.59999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="565.0" dy="0">Hidden file = name starts with a dot.</tspan><tspan x="565.0" dy="15.600000000000001">ls hides it, ls -a shows it.</tspan><tspan x="565.0" dy="15.600000000000001">find / searches the whole tree.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" role="img" aria-label="Ports: one machine, many doors (levels 14-16)"><title>Ports: one machine, many doors (levels 14-16)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="400" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Ports: one machine, many doors (levels 14-16)</text><rect x="250" y="50" width="260" height="54" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="380.0" y="81.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">localhost  (the server you are on)</tspan></text><line x1="380" y1="104" x2="140" y2="150" stroke="#64748B" stroke-width="1.6"/><rect x="40" y="150" width="200" height="74" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="140.0" y="183.39999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="140.0" dy="0">30000</tspan><tspan x="140.0" dy="15.600000000000001">plain TCP</tspan></text><rect x="40" y="250" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="140.0" y="284.85" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="140.0" dy="0">nc localhost 30000</tspan></text><line x1="140" y1="250" x2="140" y2="224" stroke="#2563EB" stroke-width="2" marker-end="url(#ablue)"/><line x1="380" y1="104" x2="370" y2="150" stroke="#64748B" stroke-width="1.6"/><rect x="270" y="150" width="200" height="74" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="370.0" y="183.39999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="370.0" dy="0">30001</tspan><tspan x="370.0" dy="15.600000000000001">TLS / SSL</tspan></text><rect x="270" y="250" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="370.0" y="277.70000000000005" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="370.0" dy="0">openssl s_client -connect</tspan><tspan x="370.0" dy="14.3">localhost:30001</tspan></text><line x1="370" y1="250" x2="370" y2="224" stroke="#16A34A" stroke-width="2" marker-end="url(#agreen)"/><line x1="380" y1="104" x2="600" y2="150" stroke="#64748B" stroke-width="1.6"/><rect x="500" y="150" width="200" height="74" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="600.0" y="167.79999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="600.0" dy="0">31000-32000</tspan><tspan x="600.0" dy="15.600000000000001">1000 ports: most closed,</tspan><tspan x="600.0" dy="15.600000000000001">some echo, ONE speaks TLS</tspan><tspan x="600.0" dy="15.600000000000001">and returns a key</tspan></text><rect x="500" y="250" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="600.0" y="277.70000000000005" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="600.0" dy="0">nmap -p 31000-32000 localhost</tspan><tspan x="600.0" dy="14.3">then openssl s_client</tspan></text><line x1="600" y1="250" x2="600" y2="224" stroke="#D97706" stroke-width="2" marker-end="url(#aamber)"/><text x="20" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">Plain TCP: text goes over the wire as-is.  TLS: encrypted first, so nc cannot talk to it.</tspan></text><text x="20" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="20" dy="0">If s_client prints RENEGOTIATING / KEYUPDATE, add -quiet (a line starting with R or k is read as a command).</tspan></text></svg>
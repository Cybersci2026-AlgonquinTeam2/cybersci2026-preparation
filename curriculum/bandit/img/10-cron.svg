<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" role="img" aria-label="cron: the server runs a script on a schedule (levels 21-23)"><title>cron: the server runs a script on a schedule (levels 21-23)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="330" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">cron: the server runs a script on a schedule (levels 21-23)</text><line x1="30" y1="90" x2="30" y2="120" stroke="#64748B" stroke-width="1.6"/><text x="30" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="30" dy="0">min 0</tspan></text><line x1="148" y1="90" x2="148" y2="120" stroke="#64748B" stroke-width="1.6"/><text x="148" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="148" dy="0">min 1</tspan></text><line x1="266" y1="90" x2="266" y2="120" stroke="#64748B" stroke-width="1.6"/><text x="266" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="266" dy="0">min 2</tspan></text><line x1="384" y1="90" x2="384" y2="120" stroke="#64748B" stroke-width="1.6"/><text x="384" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="384" dy="0">min 3</tspan></text><line x1="502" y1="90" x2="502" y2="120" stroke="#64748B" stroke-width="1.6"/><text x="502" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="502" dy="0">min 4</tspan></text><line x1="620" y1="90" x2="620" y2="120" stroke="#64748B" stroke-width="1.6"/><text x="620" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="620" dy="0">min 5</tspan></text><line x1="30" y1="105" x2="740" y2="105" stroke="#2563EB" stroke-width="1.6"/><rect x="30" y="140" width="200" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="130.0" y="172.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="130.0" dy="0">/etc/cron.d/cronjob_banditN</tspan><tspan x="130.0" dy="13.0">* * * * * banditN script.sh</tspan></text><rect x="280" y="140" width="200" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="380.0" y="164.54999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">script.sh (runs as banditN)</tspan><tspan x="380.0" dy="14.3">writes password into</tspan><tspan x="380.0" dy="14.3">/tmp/&lt;some name&gt;</tspan></text><rect x="530" y="140" width="200" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="630.0" y="171.39999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="630.0" dy="0">YOU read /tmp/&lt;name&gt;</tspan><tspan x="630.0" dy="15.600000000000001">with cat</tspan></text><line x1="230" y1="175" x2="280" y2="175" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="480" y1="175" x2="530" y2="175" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="30" y="235" width="700" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="261.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">Method: 1) ls /etc/cron.d   2) cat the job   3) cat the script it runs   4) work out the output filename   5) cat it.</tspan><tspan x="380.0" dy="15.600000000000001">Level 23 is different: YOU write the script, cron (as bandit24) runs it for you.</tspan></text></svg>
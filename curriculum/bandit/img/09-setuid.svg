<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" role="img" aria-label="setuid: borrow the file owner&#x27;s identity (levels 19, 26)"><title>setuid: borrow the file owner&#x27;s identity (levels 19, 26)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="340" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">setuid: borrow the file owner&#x27;s identity (levels 19, 26)</text><rect x="30" y="60" width="330" height="120" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="195.0" y="99.2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="195.0" dy="0">Normal program</tspan><tspan x="195.0" dy="16.900000000000002">you (bandit19) run: cat</tspan><tspan x="195.0" dy="16.900000000000002">→ runs AS bandit19</tspan><tspan x="195.0" dy="16.900000000000002">→ /etc/bandit_pass/bandit20: DENIED</tspan></text><rect x="400" y="60" width="330" height="120" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="565.0" y="99.2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="565.0" dy="0">setuid program  -rwsr-x---</tspan><tspan x="565.0" dy="16.900000000000002">./bandit20-do cat ...</tspan><tspan x="565.0" dy="16.900000000000002">→ runs AS bandit20 (owner)</tspan><tspan x="565.0" dy="16.900000000000002">→ file readable: ALLOWED</tspan></text><rect x="30" y="205" width="700" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="380.0" y="237.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="380.0" dy="0">ls -l shows the &#x27;s&#x27; in the owner&#x27;s execute slot:  -rwsr-x---  bandit20 bandit19 bandit20-do</tspan></text><text x="30" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="30" dy="0">The helper executes whatever command you pass it, but as the owner.  Real-world: this is why setuid</tspan></text><text x="30" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="30" dy="0">binaries are prime privilege-escalation targets (GTFOBins, find / -perm -4000).</tspan></text></svg>
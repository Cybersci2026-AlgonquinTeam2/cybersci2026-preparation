<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" role="img" aria-label="The uppercase shell (level 32)"><title>The uppercase shell (level 32)</title><defs><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker></defs><rect width="760" height="270" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">The uppercase shell (level 32)</text><rect x="30" y="60" width="160" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="110.0" y="92.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="110.0" dy="0">you type:  ls</tspan></text><rect x="250" y="60" width="190" height="56" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="345.0" y="84.4" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="345.0" dy="0">shell uppercases:</tspan><tspan x="345.0" dy="15.600000000000001">LS</tspan></text><rect x="500" y="60" width="230" height="56" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/><text x="615.0" y="92.2" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="615.0" dy="0">LS: command not found</tspan></text><line x1="190" y1="88" x2="250" y2="88" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="440" y1="88" x2="500" y2="88" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><rect x="30" y="150" width="160" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="110.0" y="182.9" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="110.0" dy="0">you type:  $0</tspan></text><rect x="250" y="150" width="190" height="56" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/><text x="345.0" y="174.39999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="345.0" dy="0">$0 = name of the</tspan><tspan x="345.0" dy="15.600000000000001">running shell (sh)</tspan></text><rect x="500" y="150" width="230" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/><text x="615.0" y="174.39999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="615.0" dy="0">a normal sh starts:</tspan><tspan x="615.0" dy="15.600000000000001">lowercase works again</tspan></text><line x1="190" y1="178" x2="250" y2="178" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><line x1="440" y1="178" x2="500" y2="178" stroke="#64748B" stroke-width="2" marker-end="url(#agray)"/><text x="30" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="30" dy="0">Variables are not commands, so uppercasing $0 changes nothing, and it expands to the shell itself.</tspan></text></svg>
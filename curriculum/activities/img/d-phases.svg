<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 562" width="420" height="562" role="img" aria-label="Phases of a defence challenge"><title>Phases of a defence challenge</title><rect width="420" height="562" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Phases of a defence challenge</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">from days before to the patch</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">BEFORE: learn the rules, scoring, tick length,</tspan><tspan x="210.0" dy="17.6">infrastructure (Docker/VMs)</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">PREP (first 30-60 min): git baseline, backup</tspan><tspan x="210.0" dy="17.6">tarball, know how to stop/start the app</tspan></text><line x1="210.0" y1="243.7" x2="210.0" y2="261.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,257.7 L210.0,267.7 L216.0,257.7 z" fill="#64748B"/><rect x="16" y="271.7" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="293.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">INVESTIGATE: find the exploits that are actually</tspan><tspan x="210.0" dy="17.6">being used</tspan></text><line x1="210.0" y1="330.8" x2="210.0" y2="348.8" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,344.8 L210.0,354.8 L216.0,344.8 z" fill="#64748B"/><rect x="16" y="358.8" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="380.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">PATCH: smallest change that stops the exploit;</tspan><tspan x="210.0" dy="17.6">deploy; verify</tspan></text><line x1="210.0" y1="417.90000000000003" x2="210.0" y2="435.90000000000003" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,431.90000000000003 L210.0,441.90000000000003 L216.0,431.90000000000003 z" fill="#64748B"/><rect x="16" y="445.90000000000003" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="467.90000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">WATCH: confirm health checks stay green; revert if</tspan><tspan x="210.0" dy="17.6">needed</tspan></text><text x="16" y="519.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">You only score for vulnerabilities that are being</tspan><tspan x="16" dy="16.9">actively exploited.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 545" width="420" height="545" role="img" aria-label="The hint ladder"><title>The hint ladder</title><rect width="420" height="545" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">The hint ladder</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">never jump straight to the solution</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">H0: re-read the objective and your notes (2 min)</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">H1: ask &#x27;what is this category / what tool tests</tspan><tspan x="210.0" dy="17.6">it?&#x27;</tspan></text><line x1="210.0" y1="226.15" x2="210.0" y2="244.15" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,240.15 L210.0,250.15 L216.0,240.15 z" fill="#64748B"/><rect x="16" y="254.15" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">H2: read the section&#x27;s &#x27;steps&#x27; table without the</tspan><tspan x="210.0" dy="17.6">commands</tspan></text><line x1="210.0" y1="313.25" x2="210.0" y2="331.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,327.25 L210.0,337.25 L216.0,327.25 z" fill="#64748B"/><rect x="16" y="341.25" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="363.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">H3: read the commands, run them, predict the</tspan><tspan x="210.0" dy="17.6">output first</tspan></text><line x1="210.0" y1="400.35" x2="210.0" y2="418.35" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,414.35 L210.0,424.35 L216.0,414.35 z" fill="#64748B"/><rect x="16" y="428.35" width="388" height="53.1" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="450.35" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">H4: read a public writeup AFTER you have an</tspan><tspan x="210.0" dy="17.6">observation</tspan></text><text x="16" y="501.95000000000005" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Log which hint level you reached. It tells you which</tspan><tspan x="16" dy="16.9">reading to repeat.</tspan></text></svg>
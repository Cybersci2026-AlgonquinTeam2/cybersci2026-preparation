<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 349" width="420" height="349" role="img" aria-label="Defence CTF formats"><title>Defence CTF formats</title><rect width="420" height="349" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Defence CTF formats</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">where each one appears</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">JEOPARDY DEFENCE CHALLENGE: attacks run on demand;</tspan><tspan x="210.0" dy="16.9">patch any time for full points. CyberSci Regionals</tspan></text><rect x="16" y="157.25" width="388" height="68.6" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">DEFENCE COMPETITION: attacks every tick (e.g. 2</tspan><tspan x="210.0" dy="16.9">min); points gained or lost each tick. CyberSci</tspan><tspan x="210.0" dy="16.9">Nationals</tspan></text><rect x="16" y="233.875" width="388" height="51.8" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="255.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ATTACK &amp; DEFENCE: health checks (SLA) every tick;</tspan><tspan x="210.0" dy="16.9">you also attack other teams. ICC, ECSC</tspan></text><text x="16" y="306.125" font-family="Helvetica, Arial, sans-serif" 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 384" width="420" height="384" role="img" aria-label="Five ways to find the exploit"><title>Five ways to find the exploit</title><rect width="420" height="384" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Five ways to find the exploit</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">from the workshop</tspan></text><rect x="16" y="97.5" width="388" height="34.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1 Watch the network (Wireshark, ssh remote capture)</tspan></text><rect x="16" y="140.375" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="161.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2 Look for indicators on the live service (broken</tspan><tspan x="210.0" dy="16.9">images, odd accounts)</tspan></text><rect x="16" y="200.125" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="221.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3 Review the code (secrets, injection, OWASP Top 10)</tspan></text><rect x="16" y="243.0" width="388" height="34.9" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="264.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">4 Add your own logging where it matters</tspan></text><rect x="16" y="285.875" width="388" height="34.9" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="307.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">5 Go on offence: reproduce the attack yourself</tspan></text><text x="16" y="341.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Network is king until traffic is encrypted or the bug</tspan><tspan x="16" dy="16.9">is pure logic.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 362" width="420" height="362" role="img" aria-label="Attempt grades"><title>Attempt grades</title><rect width="420" height="362" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Attempt grades</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">be honest: they drive the plan</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">A  Unaided: no hints, no notes beyond your cheat</tspan><tspan x="210.0" dy="17.6">sheet</tspan></text><rect x="16" y="158.6" width="388" height="35.5" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">B  Hint 1-2: used the first hints only</tspan></text><rect x="16" y="202.14999999999998" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="224.14999999999998" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">C  Hint 3+ or a peek at the approach</tspan></text><rect x="16" y="245.7" width="388" height="53.1" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="267.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">D  Needed the full solution: redo from scratch</tspan><tspan x="210.0" dy="17.6">later</tspan></text><text x="16" y="319.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Target: Attempt 1 is B or C. Attempt 2 is A or B. If</tspan><tspan x="16" dy="16.9">Attempt 2 is C or D, re-read and repeat in 2 days.</tspan></text></svg>
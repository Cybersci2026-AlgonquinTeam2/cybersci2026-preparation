<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 315" width="420" height="315" role="img" aria-label="Natas and Bandit progression"><title>Natas and Bandit progression</title><rect width="420" height="315" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Natas and Bandit progression</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">web and Linux ladders</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Bandit 0-12 shell basics → 13-20 keys, ports, setuid</tspan><tspan x="210.0" dy="16.9">→ 21-26 cron, escapes → 27-33 git</tspan></text><rect x="16" y="157.25" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Natas 0-10 HTTP basics → 11-20 crypto, uploads, SQLi</tspan><tspan x="210.0" dy="16.9">→ 21-34 sessions, advanced</tspan></text><rect x="16" y="217.0" width="388" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="238.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Narnia / Leviathan: read source, setuid binaries,</tspan><tspan x="210.0" dy="16.9">buffer overflows</tspan></text><text x="16" y="289.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan 
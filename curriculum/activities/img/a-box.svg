<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 527" width="420" height="527" role="img" aria-label="Attacking a whole machine"><title>Attacking a whole machine</title><rect width="420" height="527" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Attacking a whole machine</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">VulnHub and boxes: the five phases</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">RECON: scan ports, identify services and versions</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">ENUMERATE: each service by hand (web paths,</tspan><tspan x="210.0" dy="17.6">shares, users)</tspan></text><line x1="210.0" y1="226.15" x2="210.0" y2="244.15" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,240.15 L210.0,250.15 L216.0,240.15 z" fill="#64748B"/><rect x="16" y="254.15" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">FOOTHOLD: a weakness that gives you 
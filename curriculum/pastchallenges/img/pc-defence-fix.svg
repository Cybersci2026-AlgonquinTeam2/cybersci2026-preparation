<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 488" width="420" height="488" role="img" aria-label="Defence services: the common fixes"><title>Defence services: the common fixes</title><rect width="420" height="488" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Defence services: the common fixes</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Voter Registry, Chatbot, Candidate Registry</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Signatures: verify them properly (not just their</tspan><tspan x="210.0" dy="17.6">length)</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">JWT: never make signature verification optional</tspan></text><line x1="210.0" y1="226.14999999999998" x2="210.0" y2="244.14999999999998" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,240.14999999999998 L210.0,250.14999999999998 L216.0,240.14999999999998 z" fill="#64748B"/><rect x="16" y="254.14999999999998" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="276.15" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Access control: check the user owns the record</tspan><tspan x="210.0" dy="17.6">(and the tool call)</tspan></text><line x1="210.0" y1="313.25" x2="210.0" y2="331.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,327.25 L210.0,337.25 L216.0,327.25 z" fill="#64748B"/><rect x="16" y="341.25" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="363.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Sessions: random tokens, not base64 of the</tspan><tspan x="210.0" dy="17.6">username</tspan></text><line x1="210.0" y1="400.35" x2="210.0" y2="418.35" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,414.35 L210.0,424.35 L216.0,414.35 z" fill="#64748B"/><rect x="16" y="428.35" width="388" height="35.5" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="450.35" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Test: re-run the attack and the health check</tspan></text></svg>
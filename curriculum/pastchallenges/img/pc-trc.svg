<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 492" width="420" height="492" role="img" aria-label="TRC: nested encodings"><title>TRC: nested encodings</title><rect width="420" height="492" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">TRC: nested encodings</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">crypto warmup that needs a script</tspan></text><rect x="16" y="97.5" width="388" height="35.5" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Any message to the server gets a Morse-code reply</tspan></text><line x1="210.0" y1="139.05" x2="210.0" y2="157.05" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,153.05 L210.0,163.05 L216.0,153.05 z" fill="#64748B"/><rect x="16" y="167.05" width="388" height="35.5" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="189.05" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Decode the Morse: you get Base32 text</tspan></text><line x1="210.0" y1="208.60000000000002" x2="210.0" y2="226.60000000000002" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,222.60000000000002 L210.0,232.60000000000002 L216.0,222.60000000000002 z" fill="#64748B"/><rect x="16" y="236.60000000000002" width="388" height="35.5" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="258.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Decode the Base32: the first message</tspan></text><line x1="210.0" y1="278.15000000000003" x2="210.0" y2="296.15000000000003" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,292.15000000000003 L210.0,302.15000000000003 L216.0,292.15000000000003 z" fill="#64748B"/><rect x="16" y="306.15000000000003" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="328.15000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Part 2: send an HTTP GET request, encoded the same</tspan><tspan x="210.0" dy="17.6">way (Base32, then Morse)</tspan></text><line x1="210.0" y1="365.25000000000006" x2="210.0" y2="383.25000000000006" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,379.25000000000006 L210.0,389.25000000000006 L216.0,379.25000000000006 z" fill="#64748B"/><rect x="16" y="393.25000000000006" width="388" height="35.5" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="415.25000000000006" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Script the encode/decode loop; the server answers</tspan></text><text x="16" y="449.30000000000007" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Lesson: when the same transform repeats, write the</tspan><tspan x="16" dy="16.9">script early.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 507" width="420" height="507" role="img" aria-label="Where to start with the past challenges"><title>Where to start with the past challenges</title><rect width="420" height="507" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Where to start with the past challenges</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">easiest wins first</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1 Warmups: CySpace, Punched card 1, Feed Me, TRC,</tspan><tspan x="210.0" dy="16.9">Leaked and Loaded</tspan></text><rect x="16" y="157.25" width="388" height="34.9" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2 CyberChef-style: Encrypted MFA, Ballot Scanner 1-2</tspan></text><rect x="16" y="200.125" width="388" height="34.9" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="221.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3 Web chains: Secret Rally, corporate complexity</tspan></text><rect x="16" y="243.0" width="388" height="34.9" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="264.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">4 Defence: Defence CTF 101 workshop, then Inventory</tspan></text><rect x="16" y="285.875" width="388" height="34.9" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="307.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">5 Crypto misuse: parts, candidate_registry (PCBC)</tspan></text><rect x="16" y="328.75" width="388" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="350.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">6 Forensics and implants: Data is the new currency,</tspan><tspan x="210.0" dy="16.9">Spyware 1</tspan></text><rect x="16" y="388.5" width="388" height="51.8" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">7 RE: Water treatment, Spyware 2-3, fishing-game,</tspan><tspan x="210.0" dy="16.9">Vector Veil</tspan></text><rect x="16" y="448.25" width="388" height="34.9" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="469.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">8 Advanced: Enigma, pwn (heap/ROP)</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 349" width="420" height="349" role="img" aria-label="Inventory (BASIC) defence bugs"><title>Inventory (BASIC) defence bugs</title><rect width="420" height="349" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Inventory (BASIC) defence bugs</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">three exploits, three fixes</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1 EVAL$ on user input: leaks data such as the admin</tspan><tspan x="210.0" dy="16.9">password → remove EVAL$</tspan></text><rect x="16" y="157.25" width="388" height="68.6" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="178.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2 Global MODE reused as a local variable: scrolling</tspan><tspan x="210.0" dy="16.9">backward turns you into an admin → declare it LOCAL</tspan><tspan x="210.0" dy="16.9">or rename it</tspan></text><rect x="16" y="233.875" width="388" height="51.8" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/><text x="210.0" y="255.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3 (Part 3) see the repo; same method: read the code,</tspan><tspan x="210.0" dy="16.9">find the shared state, patch</tspan></text><text x="16" y="306.125" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Lesson: old languages share variables silently; trace</tspan><tspan x="16" dy="16.9">where state is written.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 453" width="420" height="453" role="img" aria-label="Piecewise RSA"><title>Piecewise RSA</title><rect width="420" height="453" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Piecewise RSA</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">parts</tspan></text><rect x="16" y="97.5" width="388" height="51.8" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Message split into 4-byte pieces; each piece</tspan><tspan x="210.0" dy="16.9">encrypted with the same public key</tspan></text><line x1="210.0" y1="155.25" x2="210.0" y2="173.25" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,169.25 L210.0,179.25 L216.0,169.25 z" fill="#64748B"/><rect x="16" y="183.25" width="388" height="51.8" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="204.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Same plaintext piece always gives the same</tspan><tspan x="210.0" dy="16.9">ciphertext</tspan></text><line x1="210.0" y1="241.0" x2="210.0" y2="259.0" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,255.0 L210.0,265.0 L216.0,255.0 z" fill="#64748B"/><rect x="16" y="269.0" width="388" height="51.8" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="290.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Encrypt every printable 4-byte candidate (~100^4 =</tspan><tspan x="210.0" dy="16.9">2^27) and compare</tspan></text><line x1="210.0" y1="326.75" x2="210.0" y2="344.75" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,340.75 L210.0,350.75 L216.0,340.75 z" fill="#64748B"/><rect x="16" y="354.75" width="388" height="51.8" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="210.0" y="376.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Matches reveal each piece; join them into the</tspan><tspan x="210.0" dy="16.9">message</tspan></text><text x="16" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Lesson: textbook RSA on small inputs is a lookup table.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 388" width="420" height="388" role="img" aria-label="Water treatment: three RE steps"><title>Water treatment: three RE steps</title><rect width="420" height="388" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">Water treatment: three RE steps</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">16-bit DOS program</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">1 Get it running (DOSBox, real DOS, or 32-bit</tspan><tspan x="210.0" dy="17.6">Windows) to see the program&#x27;s name</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">2 Reverse the password check: it compares an MD2</tspan><tspan x="210.0" dy="17.6">hash; test a common-password list</tspan></text><line x1="210.0" y1="243.7" x2="210.0" y2="261.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,257.7 L210.0,267.7 L216.0,257.7 z" fill="#64748B"/><rect x="16" y="271.7" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="293.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">3 Reverse the safety code: compares keyboard scan</tspan><tspan x="210.0" dy="17.6">codes, not characters</tspan></text><text x="16" y="345.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Lesson: legacy tooling is part of the puzzle; hashing</tspan><tspan x="16" dy="16.9">choices can be old.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 528" width="420" height="528" role="img" aria-label="AES-PCBC block swapping"><title>AES-PCBC block swapping</title><rect width="420" height="528" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><text x="16" y="33" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="16" dy="0">AES-PCBC block swapping</tspan></text><text x="16" y="71.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">candidate_registry</tspan></text><rect x="16" y="97.5" width="388" height="53.1" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/><text x="210.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Server decrypts a payload; must be valid JSON with</tspan><tspan x="210.0" dy="17.6">the right token and a new username</tspan></text><line x1="210.0" y1="156.6" x2="210.0" y2="174.6" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,170.6 L210.0,180.6 L216.0,170.6 z" fill="#64748B"/><rect x="16" y="184.6" width="388" height="53.1" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="210.0" y="206.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">PCBC chains plaintext AND ciphertext into the next</tspan><tspan x="210.0" dy="17.6">block</tspan></text><line x1="210.0" y1="243.7" x2="210.0" y2="261.7" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,257.7 L210.0,267.7 L216.0,257.7 z" fill="#64748B"/><rect x="16" y="271.7" width="388" height="53.1" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="210.0" y="293.7" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Swapping two ciphertext blocks only damages two</tspan><tspan x="210.0" dy="17.6">plaintext blocks</tspan></text><line x1="210.0" y1="330.8" x2="210.0" y2="348.8" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,344.8 L210.0,354.8 L216.0,344.8 z" fill="#64748B"/><rect x="16" y="358.8" width="388" height="53.1" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="210.0" y="380.8" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Craft a swap so the JSON still parses and the</tspan><tspan x="210.0" dy="17.6">token field survives</tspan></text><line x1="210.0" y1="417.90000000000003" x2="210.0" y2="435.90000000000003" stroke="#64748B" stroke-width="2.2"/><path d="M204.0,431.90000000000003 L210.0,441.90000000000003 L216.0,431.90000000000003 z" fill="#64748B"/><rect x="16" y="445.90000000000003" width="388" height="35.5" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/><text x="210.0" y="467.90000000000003" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle"><tspan x="210.0" dy="0">Server accepts it and reveals the secret</tspan></text><text x="16" y="501.95000000000005" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"><tspan x="16" dy="0">Lesson: encryption without authentication is malleable.</tspan></text></svg>